<style>
html{color-scheme:light}
  :root{
    --sky:#8FD8F8;
    --sky-light:#D9F3FF;
    --card:#FFFFFF;

    --primary:#FF6B4A;
    --primary-dark:#E8532F;

  #gateDifficultyRow{

      display:contents;
    }

    /* 由上至下：標題/打招呼 → 時間錯誤 → 指令區塊 → 棋盤 →
       方向鍵 → 等級顯示 → 開始遊戲鍵 */
    #boardWrap > h1{
      order:10;
      margin-bottom:4px;
      color:var(--primary-dark);
      text-shadow:none;
    }
    #boardWrap > .seal{ order:20; margin-bottom:6px; }
    #panel > #playerGreeting{ order:30; }

    #panel > #statRow{ order:40; margin:6px 0; }

    #panel > #stageLabel{ order:50; }
    #panel > #instructionBox{ order:60; }
    #panel > #errorMsg{ order:70; }

    #boardWrap > canvas{
      order:80;
      align-self:center;    /* canvas 有內建尺寸，stretch 對它不生效，改用置中 */
      margin:6px 0;
      background:#000;      /* #boardWrap 解散後，黑色相框改由 canvas 自己承擔 */
      padding:6px;
      border:2px solid var(--outline);
      border-radius:12px;
      box-shadow:4px 4px 0 rgba(0,0,0,.25);
      box-sizing:content-box;
    }

    #panel > #dpad{ order:90; margin:4px 0 6px; }

    #panel > #currentLevelBadge{ order:100; margin-bottom:8px; }


    #panel > #keysHint{ display:none; }  /* 方向鍵就在棋盤下方，手機上不需要文字提示 */

    /* 方向鍵在手機上改扁一點：變寬變矮，減少版面高度 */
    #dpad{
      gap:8px;
    }
    #dpadCenterCol{
      gap:5px;
    }
    #dpad button{
      width:66px;
      height:44px;         /* 原本 38px，低於建議的最小可觸控尺寸，容易點錯/點不到 */
      border-radius:999px;
      box-shadow:none;
      font-size:17px;
    }

    /* 遊戲進行中收合非必要資訊，讓棋盤＋方向鍵能一起留在畫面內 */
    body.mobile-playing #boardWrap > h1,
    body.mobile-playing #boardWrap > .seal,
    body.mobile-playing #panel > #playerGreeting,
    body.mobile-playing #panel > #currentLevelBadge{
      display:none;
    }
    body.mobile-playing #panel > #statRow{ margin:0 0 6px; }
    body.mobile-playing #boardWrap > canvas{ margin:4px 0; }

    /* 結算/排行榜彈窗在遊戲進行中要疊在畫面上面，維持 fixed；
       手機上有些瀏覽器（LINE 內建瀏覽器、Chrome 等）自己的工具列是固定貼在
       畫面底部的，並不會被 100vh/100svh 這類視窗高度單位排除掉，算出來的高度
       會比實際看得到的範圍還高，導致最下面的按鈕被工具列蓋住、點不到。
       與其去猜工具列的高度，改成讓彈窗本身可以上下捲動、由畫面頂端開始排列，
       並在底部留一大段安全空間，不管哪種瀏覽器、工具列多高，都能捲動到看得見按鈕為止 */
    #resultModal, #leaderboardModal{
      align-items:flex-start;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding-top:max(16px, env(safe-area-inset-top));
      padding-bottom:calc(90px + env(safe-area-inset-bottom));
      min-height:100vh;
      min-height:100svh;
    }

    /* 姓名/選難度畫面是進遊戲前的第一個畫面，這時候遊戲本體本來就是隱藏的，
       不需要疊在畫面「上面」。改成一般文件流裡的區塊，直接交給瀏覽器原生的
       頁面捲動處理，徹底避開 fixed 疊層 + 動態工具列這整類不穩定的行為 */
    #nameGate{
      position:static;
      inset:auto;
      min-height:100vh;
      min-height:100svh;
      /* 卡片右上角的「寶」字圓章往外凸出、還帶旋轉角度，實際占用範圍比看起來大，
         頂部要留夠空間才不會被畫面邊界切掉 */
      padding:44px 20px calc(40px + env(safe-area-inset-bottom));
    }
    html body.gate-open{
      overflow-y:auto;
      height:auto;
    }

    /* 縮減姓名/難度選擇畫面各區塊間的留白，讓整欄盡量在一屏內顯示完，
       減少需要捲動的機會；下面這句提示語手機版直接拿掉騰空間 */
    #nameCard{
      padding:14px 18px 14px;
    }
    #nameGateIcons{
      font-size:26px;
      letter-spacing:8px;
      margin:0 0 4px;
    }
    #nameCard h1{
      font-size:17px;
    }
    #nameCard .seal{
      margin:6px 0 10px;
    }
    #playerNameInput{
      padding:10px 12px;
    }
    #nameGateError{
      margin-top:4px;
    }
    #gateDifficultyRow{
      margin:4px 0 2px;
    }
    #gateDifficultyLabel{
      margin:0 0 6px;
    }
    #gateDifficultyButtons{
      gap:6px;
    }
    .gateDiffBtn{
      padding:7px 10px;
    }
    #nameGateBtn{
      margin-top:10px;
    }
    #nameGateFooter{
      display:none;
    }
  }

  /* ===================== v2：共用設定、膠囊按鈕、拼音注音、控制鍵、彈窗 ===================== */
  .hide{ display:none !important; }
  small{ display:block; font-size:.72em; font-weight:500; opacity:.85; line-height:1.2; letter-spacing:0; }
  button{ touch-action:manipulation; }
  /* 方向鍵：不需要捲動／縮放手勢，直接告訴瀏覽器，Chrome 就不用先判斷這是什麼手勢才把觸控交給網頁 */
  #dpad button{ touch-action:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  button:disabled{ opacity:.45; cursor:default; filter:none; }
  .secBtn{ background:#fff; color:var(--ink); }
  #nextLevelBtn{ background:var(--teal); }
  .gameTitle small{ font-size:.62em; }
  .seal small{ display:inline; font-size:.95em; }
  .seal small::before{ content:" · "; }
  .ver{ font-size:11px; color:#a9a39a; margin:10px 0 0; font-weight:500; }
  #gateLbBtn{ margin-top:8px; }

  /* ⚙️：三款遊戲都放右上角 */
  .gear{
    width:40px; height:40px; padding:0; margin:0; flex:0 0 auto;
    border-radius:999px; background:#fff; color:var(--ink); font-size:19px; letter-spacing:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:2px 2px 0 rgba(0,0,0,.2);
  }
  #nameCard .gear{ position:absolute; top:14px; right:14px; z-index:2; }
  #statRow{ align-items:center; }
  #statRow .gear{ margin-left:3px; }
  #statRow .statLbl{ font-size:12px; font-weight:600; color:var(--ink); }
  #statRow .statLbl small{ font-size:10px; }
  #statRow .statVal{ font-size:18px; }

  .warn{ background:#fff7e6; border:1.5px solid #f5d28a; color:#8a5a00; border-radius:12px; padding:6px 10px; font-size:12px; margin:6px 0; text-align:center; font-weight:600; }
  #nameCard .warn{ margin:0 0 10px; }

  /* 指令文字：每個字上面放拼音／注音 */
  #instructionBox{ font-size:22px; min-height:52px; }
  .zhl{ display:inline-flex; flex-wrap:wrap; justify-content:center; align-items:flex-end; row-gap:4px; }
  .ru{ display:inline-flex; flex-direction:column; align-items:center; line-height:1.15; margin:0 1px; }
  .ru .ph{ font-size:.5em; font-weight:500; line-height:1.25; white-space:nowrap; }
  .ru .ph.zy{ font-size:.48em; }
  .ru .hz{ font-weight:700; }
  .listen{ font-size:15px; }
  #currentLevelName small{ display:inline; font-size:11px; }
  #currentLevelName small::before{ content:" · "; }
  #currentLevelDesc{ display:block; font-size:11px; color:#5b5b63; font-weight:600; }
  #stageLabel small{ font-size:10px; }
  #errorMsg small{ font-size:11px; }

  /* 再聽一次／暫停／重新開始／主選單 */
  #ctlRow{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:4px; }
  #ctlRow button{ margin:0; padding:6px 4px; font-size:13px; letter-spacing:0; }
  #ctlRow button small{ font-size:10px; }
  #replayBtn{ background:var(--secondary); color:var(--ink); }

  /* 第 1 關提示：該按的方向鍵發亮 */
  #dpad button.hintGlow{ background:var(--secondary); color:var(--ink); animation:hintGlow .8s ease-in-out infinite alternate; }
  @keyframes hintGlow{ from{ box-shadow:0 0 0 0 rgba(255,210,63,.95); } to{ box-shadow:0 0 0 9px rgba(255,210,63,.15); } }

  /* 暫停／確認／⚙️ 彈窗 */
  .ov{ position:fixed; inset:0; z-index:1100; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(38,38,43,.6); overflow-y:auto; }
  #confirmov{ z-index:1150; }
  #setov{ z-index:1200; }
  .ovCard{ width:100%; max-width:380px; margin:auto; background:#fff; border:3px solid var(--outline); border-radius:20px; padding:18px 16px; text-align:center; box-shadow:6px 6px 0 rgba(0,0,0,.3); }
  .ovIcon{ font-size:40px; }
  .ovCard h2{ margin:0 0 10px; color:var(--primary-dark); font-size:20px; }
  .ovRow{ display:flex; gap:8px; }
  .ovRow button{ flex:1; }
  #confirmMsg{ font-size:16px; margin:4px 0 10px; }
  .setGroup{ margin:10px 0; text-align:left; }
  .setGroup h3{ font-size:13px; margin:0 0 6px; color:var(--primary-dark); }
  .setGroup h3 small{ display:inline; font-size:11px; }
  .setGroup h3 small::before{ content:" · "; }
  .opts{ display:flex; flex-wrap:wrap; gap:6px; }
  .opt{ flex:1 1 0; min-width:0; width:auto; margin:0; padding:6px 8px; background:#fff; color:var(--ink); font-size:14px; letter-spacing:0; box-shadow:2px 2px 0 rgba(0,0,0,.18); }
  .opts.two .opt{ flex:1 1 40%; }
  .opt.on{ background:var(--primary); color:#fff; }

  /* 結果畫面 */
  #resultCard{ padding:24px 20px 20px; }
  #resultCard h2 small{ font-size:.6em; color:var(--ink); }
  .resLevel{ font-size:13px; color:#5b5b63; margin-bottom:6px; }
  .resLevel small{ display:inline; }
  .resLevel small::before{ content:" · "; }
  .resScoreLbl{ font-size:13px; }
  .resScoreLbl small{ display:inline; }
  .resScoreLbl small::before{ content:" · "; }
  .resScore{ font-size:46px; font-weight:800; color:var(--primary-dark); line-height:1.1; }
  .resTable{ width:100%; border-collapse:collapse; margin:8px 0; font-size:13px; }
  .resTable td{ padding:4px 6px; border-bottom:1px dashed #e3dccf; text-align:left; }
  .resTable td small{ font-size:11px; color:#7a7268; }
  .gateDiffBtn .diffName small{ display:inline; font-size:12px; }
  .gateDiffBtn .diffName small::before{ content:" · "; }
  .resTable td:last-child{ text-align:right; font-weight:700; white-space:nowrap; }
  .comment{ background:#FFF6D6; border:2px dashed var(--secondary-dark); border-radius:12px; padding:6px; margin:8px 0; font-size:15px; }
  #practiceHint{ font-size:12px; color:#7a7268; margin:6px 0; }
  #lbArea{ margin:8px 0; }
  .lbList{ border:2.5px solid var(--outline); border-radius:12px; overflow:hidden; text-align:left; background:#fff; }
  .lbRowTop{ font-size:16px; grid-template-columns:32px 1fr 64px; }
  .lbRank{ font-size:17px; }
  .lbScore{ font-size:17px; }
  .lbRowMeta{ font-size:12px; padding-left:42px; }
  .lbStatus{ font-size:13px; color:#7a7268; margin:6px 0; }
  .lbNote{ font-size:12px; color:#7a7268; margin:0 0 8px; }
  #lbTabs{ display:flex; gap:6px; margin-bottom:10px; }
  #lbBody{ overflow-y:auto; min-height:0; }
  #leaderboardCard{ padding:24px 18px 18px; }
  #leaderboardCard h2 small{ font-size:.6em; color:var(--ink); }
  #lbBackBtn{ margin-top:12px; }

  @media (max-width: 700px){
    #panel > #voiceWarnGame{ order:55; }
    #panel > #ctlRow{ order:95; grid-template-columns:repeat(4,1fr); gap:5px; margin:0 0 4px; }
    #ctlRow button{ font-size:12px; padding:6px 2px; }
    #ctlRow button small{ font-size:9px; }
    #nameCard .gear{ top:10px; right:10px; }

    /* 選「中文＋外語」時，時間／錯誤、第幾步、答錯提示：中文靠左、外語靠右，放同一行，省下一行高度。
       放不下時外語會自動掉到下一行（仍靠右），不會被切掉。下方四顆控制鍵不動。 */
    #statRow .statLbl,
    #stageLabel,
    #errorMsg{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;      /* 只有中文時維持置中；有外語小字時，小字用 margin-left:auto 推到最右邊 */
      align-items:baseline;
      column-gap:8px;
    }
    #statRow .statLbl small,
    #stageLabel small,
    #errorMsg small{
      display:block;
      margin-left:auto;
      text-align:right;
    }
  }

  /* ===== 美漫風格：只改顏色、陰影、圓角，不動任何尺寸（棋盤大小的計算不受影響）===== */
  :root{ --outline:#1A1A1A; --sky:#BFE6F7; --sky-light:#E3F4FC; --secondary:#FFE45E; --primary-dark:#D93A2B; }
  body{ background:
      radial-gradient(rgba(26,26,26,.08) 1px, transparent 1.5px) 0 0/8px 8px,
      linear-gradient(180deg, var(--sky) 0%, var(--sky-light) 100%); }
  #statRow div{ border-width:3px; border-radius:6px; box-shadow:3px 3px 0 #1A1A1A; }
  #statRow span{ color:#E63946; }
  #instructionBox{
    background-color:#FFE45E;
    background-image:radial-gradient(rgba(230,57,70,.35) 1.3px, transparent 1.6px);
    background-size:7px 7px;
    border-color:#1A1A1A; border-radius:6px;
    box-shadow:4px 4px 0 #1A1A1A;
  }
  canvas{ box-shadow:4px 4px 0 #1A1A1A; border-radius:3px; }
  button{ box-shadow:3px 3px 0 #1A1A1A; }
  button:active{ box-shadow:1px 1px 0 #1A1A1A; }
  #dpad button{ color:#1A1A1A; font-weight:900; }
  #errorMsg{ color:#E63946; }

  /* ===== 美漫風格：開始頁、結算／排行榜／設定／暫停／確認視窗 ===== */
  #nameGate{ background:
      radial-gradient(rgba(26,26,26,.10) 1px, transparent 1.5px) 0 0/8px 8px,
      repeating-conic-gradient(from 0deg at 50% 18%, #BFE6F7 0 7.5deg, #D9F1FB 7.5deg 15deg); }
  #nameCard{ border:4px solid #1A1A1A; border-radius:8px; box-shadow:6px 6px 0 #1A1A1A; padding-top:40px; }
  #nameCard::before{ display:none; }
  #nameCard h1.gameTitle{
    position:absolute; left:50%; top:-26px; transform:translateX(-50%) rotate(-2deg);
    width:max-content; max-width:75%; margin:0; padding:4px 12px 5px;
    background:#E63946; color:#fff; border:4px solid #1A1A1A; box-shadow:4px 4px 0 #1A1A1A;
    font-size:26px; letter-spacing:2px; line-height:1.15; text-shadow:2px 2px 0 #1A1A1A;
  }
  #nameCard h1.gameTitle small{ font-size:11px; color:#FFE45E; text-shadow:1px 1px 0 #1A1A1A; letter-spacing:.2px; opacity:1; }
  #nameGateIcons{ margin:0 0 8px; font-size:0; letter-spacing:0; }
  #gateSprites, #pauseDog, #resSprites{ box-shadow:none; background-color:transparent; border-radius:0; }
  #gateSprites, #pauseDog{ display:block; margin:0 auto; max-width:100%; height:auto; }
  #gateSprites{ width:100%; border:3px solid #1A1A1A; border-radius:6px !important; background-color:#FFE45E !important;
    background-image:radial-gradient(rgba(230,57,70,.35) 1.3px, transparent 1.6px); background-size:7px 7px; }
  #pauseDog{ width:120px; }
  #namePrompt{ color:#1A1A1A; }
  #playerNameInput{ border:3px solid #1A1A1A; border-radius:6px; box-shadow:3px 3px 0 #1A1A1A; }
  #playerNameInput:focus{ border-color:#E63946; box-shadow:3px 3px 0 #E63946; }
  #gateDifficultyLabel{ color:#E63946; }
  .gateDiffBtn{ border:3px solid #1A1A1A; border-radius:6px; box-shadow:3px 3px 0 #1A1A1A; padding:6px 10px; }
  .gateDiffBtn .diffName{ color:#E63946; }
  .gateDiffBtn .diffDesc{ font-size:11.5px; font-weight:600; color:#444; }
  .gateDiffBtn .diffDesc small{ font-size:9.5px; font-weight:600; color:#777; opacity:1; }
  .gateDiffBtn.selected{ background-color:#FFE45E; background-image:radial-gradient(rgba(230,57,70,.35) 1.3px, transparent 1.6px);
    background-size:7px 7px; border-color:#1A1A1A; transform:translate(1px,1px); box-shadow:2px 2px 0 #1A1A1A; }
  .gateDiffBtn.selected .diffName{ color:#1A1A1A; }
  .gateDiffBtn.selected .diffDesc{ color:#1A1A1A; opacity:1; }
  #nameGateBtn{ background:#E63946; color:#fff; font-size:20px; text-shadow:2px 2px 0 #1A1A1A; box-shadow:4px 4px 0 #1A1A1A; }
  #nameGateBtn small{ color:#FFE45E; text-shadow:1px 1px 0 #1A1A1A; opacity:1; }
  @media (max-width:380px){
    .gateDiffBtn .diffDesc{ font-size:10.5px; }
    .gateDiffBtn .diffDesc small{ font-size:9px; }
  }

  /* 視窗共通：標題牌、粗黑外框、硬陰影 */
  #resultModal, #leaderboardModal{ background:
      radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.5px) 0 0/8px 8px, #3B4752; }
  .ov{ background:rgba(26,26,26,.62); }
  #resultCard, #leaderboardCard, .ovCard{ border:4px solid #1A1A1A; border-radius:8px; box-shadow:6px 6px 0 #1A1A1A; }
  #resultCard, .ovCard{ padding-top:36px; }
  #leaderboardCard{ padding-top:44px; }
  #resultCard h2, #leaderboardCard h2, .ovCard h2{
    display:inline-block; background:#E63946; color:#fff; border:4px solid #1A1A1A; box-shadow:4px 4px 0 #1A1A1A;
    padding:3px 16px 4px; transform:rotate(-2deg); margin:-58px auto 12px; font-size:22px; letter-spacing:1px;
    text-shadow:2px 2px 0 #1A1A1A; line-height:1.2;
  }
  #resultCard h2 small, #leaderboardCard h2 small, .ovCard h2 small{ color:#FFE45E; text-shadow:1px 1px 0 #1A1A1A; opacity:1; }
  #leaderboardCard h2::before{ content:"🏆 "; }
  #lbSeal{ display:none; }
  #resSprites{ display:block; margin:0 auto 4px; width:260px; max-width:100%; height:auto; }
  .resLevel{ color:#555; }
  .resScore{ color:#E63946; -webkit-text-stroke:2px #1A1A1A; paint-order:stroke fill; text-shadow:3px 3px 0 #1A1A1A; padding:0 14px; }
  .resTable td{ border-bottom:2px solid rgba(26,26,26,.13); }
  .comment{ background-color:#FFE45E; background-image:radial-gradient(rgba(230,57,70,.35) 1.3px, transparent 1.6px);
    background-size:7px 7px; border:3px solid #1A1A1A; border-radius:6px; }
  .lbList, #lbList{ border:3px solid #1A1A1A; border-radius:6px; box-shadow:3px 3px 0 #1A1A1A; }
  .lbRow{ border-bottom:2px solid rgba(26,26,26,.13); }
  .lbRowMe{ background:#FFE45E; }
  .lbRank, .lbScore{ color:#E63946; }
  .opt{ border:3px solid #1A1A1A; border-radius:999px; box-shadow:2px 2px 0 #1A1A1A; }
  .opt.on{ background:#E63946; color:#fff; text-shadow:1px 1px 0 #1A1A1A; }
  .setGroup h3, .ovCard h2 + .setGroup h3{ color:#E63946; }
  #againBtn, #setDone, #resumeBtn, #confirmYes{ background:#E63946; color:#fff; text-shadow:1px 1px 0 #1A1A1A; }
  #againBtn small, #setDone small, #resumeBtn small, #confirmYes small{ color:#FFE45E; opacity:1; }
</style>
</head>
<body class="gate-open">
<div id="nameGate">
  <div id="nameCard">
    <button type="button" class="gear" id="gateGear" aria-label="⚙️">⚙️</button>
    <div id="nameGateIcons"><canvas id="gateSprites" aria-hidden="true"></canvas></div>
    <h1 class="gameTitle" data-t="title"></h1>
    <div id="voiceWarnGate" class="warn hide"></div>
    <p id="namePrompt" data-t="namePrompt"></p>
    <input id="playerNameInput" type="text" maxlength="12" autocomplete="off">
    <div id="nameGateError"></div>
    <div id="gateDifficultyRow">
      <p id="gateDifficultyLabel" data-t="chooseLevel"></p>
      <div id="gateDifficultyButtons">
        <button type="button" class="gateDiffBtn selected" data-level="level1"><span class="diffName"></span><span class="diffDesc"></span></button>
        <button type="button" class="gateDiffBtn" data-level="level2"><span class="diffName"></span><span class="diffDesc"></span></button>
        <button type="button" class="gateDiffBtn" data-level="level3"><span class="diffName"></span><span class="diffDesc"></span></button>
        <button type="button" class="gateDiffBtn" data-level="level4"><span class="diffName"></span><span class="diffDesc"></span></button>
      </div>
    </div>
    <button id="nameGateBtn" data-t="go"></button>
    <button id="gateLbBtn" class="secBtn" data-t="lbBtn"></button>
    <p class="ver">v2-0</p>
  </div>
</div>

  try{ saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); }catch(e){}

    Object.keys(SET_OPTS).forEach(k => { if(SET_OPTS[k].includes(saved[k])) out[k] = saved[k]; });
  }else{
    writeSettings(out);
  }

}

  try{
    let cur = {};

// ===== 指令用到的字：繁體 → [簡體, 台灣讀音拼音] =====
const CH = {
  '前':['前','qián'],'進':['进','jìn'],'後':['后','hòu'],'退':['退','tuì'],'向':['向','xiàng'],'左':['左','zuǒ'],'右':['右','yòu'],'轉':['转','zhuǎn'],'格':['格','gé'],
  '一':['一','yī'],'兩':['两','liǎng'],'二':['二','èr'],'三':['三','sān'],'四':['四','sì'],'五':['五','wǔ'],'六':['六','liù'],'七':['七','qī'],'八':['八','bā'],'九':['九','jiǔ'],'十':['十','shí'],
  '找':['找','zhǎo'],'到':['到','dào'],'鑰':['钥','yào'],'匙':['匙','shi'],'了':['了','le'],'往':['往','wǎng'],'寶':['宝','bǎo'],'藏':['藏','zàng'],
  '！':['！',''],'，':['，','']
};
// 中文數字（口語計數用「兩」而非「二」）
const NUM_T = ['','一','兩','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九'];
// 一串繁體字 → 每個字 {t:繁, s:簡, p:拼音}
function toks(trad){ return [...trad].map(c => ({ t:c, s:CH[c] ? CH[c][0] : c, p:CH[c] ? CH[c][1] : '' })); }
const COMMA = { t:'，', s:'，', p:'' };
function moveToks(kind, steps){
  const tk = toks((kind === 'backward' ? '後退' : '前進') + (NUM_T[steps] || String(steps)) + '格');
  if(steps === 1) tk[2].p = 'yì';   // 一格：「一」變調唸 yì
  return tk;
}
function turnToks(kind){ return toks({ turnLeft:'向左轉', turnRight:'向右轉', turnAround:'向後轉' }[kind]); }
const KEY_TK = toks('找到鑰匙了！前往寶藏');
const TREASURE_TK = toks('找到寶藏了！');
const tradOf = tk => tk.map(x => x.t).join('');

/* 拼音（帶聲調符號）→ 注音（與跑吧！漢字、色數消消樂同一份轉換器） */
const ZY=(function(){
  var INI={b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
  var FIN={a:'ㄚ',o:'ㄛ',e:'ㄜ',ê:'ㄝ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',
    i:'ㄧ',ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',
    u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ong:'ㄨㄥ',ueng:'ㄨㄥ',
    v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ',iong:'ㄩㄥ'};
  var MARK=['','','ˊ','ˇ','ˋ'];
  function one(syl){
    var s=syl.normalize('NFD'),tone=5;
    if(/̄/.test(s))tone=1;else if(/́/.test(s))tone=2;else if(/̌/.test(s))tone=3;else if(/̀/.test(s))tone=4;
    s=s.replace(/ü/g,'v').replace(/ü/g,'v').replace(/Ü/g,'v').replace(/[̀-ͯ]/g,'').toLowerCase();
    if(!/^[a-zê]+$/.test(s))return syl;
    var ini='',rest=s,m;
    if(s==='n'||s==='m'){var zz=s==='n'?'ㄣ':'ㄇㄨ';return tone===5?'˙'+zz:zz+MARK[tone];}
    if(s==='er'||s==='r'){rest='er';}
    else if((m=s.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcs])/))){ini=m[1];rest=s.slice(ini.length);}
    else if(s[0]==='y'){rest=s.slice(1);if(/^u/.test(rest))rest=rest.replace(/^u/,'v');else if(!(rest==='i'||rest==='in'||rest==='ing'))rest='i'+rest;}
    else if(s[0]==='w'){rest=s.slice(1);rest=(rest==='u')?'u':'u'+rest;}
    if(ini&&/^[jqx]$/.test(ini))rest=rest.replace(/^u/,'v');
    if(/^(zh|ch|sh|r|z|c|s)$/.test(ini)&&rest==='i')rest='';
    var f=rest===''?'':FIN[rest];
    if(f===undefined)return syl;
    var z=(ini?INI[ini]:'')+f;
    return tone===5?'˙'+z:z+MARK[tone];
  }
  function conv(py){return String(py||'').trim().split(/\s+/).filter(Boolean).map(one).join(' ');}
  return {one:one,conv:conv};
})();

// 一串字 → HTML：每個字上面放拼音／注音（依 ⚙️；標點符號上面留空白，字才會對齊）
function zhHtml(tk){
  const ph = SETTINGS.phon;
  const top = p => {
    if(ph === 'off') return '';
    const py = p ? `<span class="ph">${esc(p)}</span>` : '<span class="ph">&nbsp;</span>';
    const zy = p ? `<span class="ph zy">${esc(ZY.one(p))}</span>` : '<span class="ph zy">&nbsp;</span>';
    return ph === 'pinyin' ? py : ph === 'zhuyin' ? zy : py + zy;
  };
  return '<span class="zhl">' + tk.map(x => `<span class="ru">${top(x.p)}<span class="hz">${esc(simp() ? x.s : x.t)}</span></span>`).join('') + '</span>';
}

function sameCell(a,b){ return a.row===b.row && a.col===b.col; }
function randCell(){ return { row: Math.floor(Math.random()*GRID), col: Math.floor(Math.random()*GRID) }; }
function turnKind(oldF, newF){
  const oi = DIRS.indexOf(oldF), ni = DIRS.indexOf(newF);
  return ( (oi+1)%4 === ni ) ? 'turnRight' : 'turnLeft';
}
function cellKey(row,col){ return row+','+col; }

function tryObstacles(excluded, count){
  const obstacles = new Set();
  let guard = 0;
  while(obstacles.size < count && guard < 800){
    guard++;
    const r = Math.floor(Math.random()*GRID);
    const c = Math.floor(Math.random()*GRID);
    const key = cellKey(r,c);
    if(excluded.has(key) || obstacles.has(key)) continue;
    obstacles.add(key);
  }
  return obstacles;
}

function bfsPath(startRow,startCol,targetRow,targetCol,obstacles){
  const startKey = cellKey(startRow,startCol);
  const targetKey = cellKey(targetRow,targetCol);
  if(startKey === targetKey) return [];
  const visited = new Set([startKey]);
  const prev = new Map();
  const queue = [{row:startRow,col:startCol}];
  let qi = 0;
  while(qi < queue.length){
    const cur = queue[qi++];
    const curKey = cellKey(cur.row,cur.col);
    if(curKey === targetKey){
      let path = [];
      let key = curKey;
      while(key !== startKey){
        const [pr,pc,dir] = prev.get(key);
        path.unshift(dir);
        key = cellKey(pr,pc);
      }
      return path;
    }
    for(const dir of DIRS){
      const d = DELTA[dir];
      const nr = cur.row + d.dr, nc = cur.col + d.dc;
      if(nr<0||nr>=GRID||nc<0||nc>=GRID) continue;
      const nk = cellKey(nr,nc);
      if(visited.has(nk) || obstacles.has(nk)) continue;
      visited.add(nk);
      prev.set(nk, [cur.row, cur.col, dir]);
      queue.push({row:nr, col:nc});
    }
  }
  return null;
}

function compressRuns(dirArray){
  const runs = [];
  for(const d of dirArray){
    if(runs.length && runs[runs.length-1].dir === d) runs[runs.length-1].steps++;
    else runs.push({dir:d, steps:1});
  }
  return runs;
}

function buildInstructionsFromRuns(runs, startFacing){
  let instructions = [];
  let facing = startFacing;
  for(const run of runs){
    const { dir, steps } = run;
    if(dir !== facing && dir !== OPPOSITE[facing]){
      instructions.push({ kind:'turn', dir, tk: turnToks(turnKind(facing, dir)) });
      facing = dir;
    }
    if(dir === OPPOSITE[facing]){
      if(Math.random() < 0.5){
        instructions.push({ kind:'move', dir, steps, tk: moveToks('backward', steps) });
      } else {
        instructions.push({ kind:'turn', dir, tk: turnToks('turnAround') });
        facing = dir;
        instructions.push({ kind:'move', dir, steps, tk: moveToks('forward', steps) });
      }
    } else {
      instructions.push({ kind:'move', dir, steps, tk: moveToks('forward', steps) });
    }
  }
  return instructions;
}

// 把指令分組：第 4 關每 2～3 句一組連續唸；其他關一句一組
function chunkInstructions(list, chunked){
  const starts = new Set();
  const labels = new Map();   // 組的第一句 index → { tk:整組文字, texts:[一句一句的繁體，給語音用] }
  let i = 0;
  while(i < list.length){
    const size = chunked ? Math.min(2 + Math.floor(Math.random()*2), list.length - i) : 1;
    starts.add(i);
    const tk = [], texts = [];
    for(let j=i; j<i+size; j++){
      if(j > i) tk.push(COMMA);
      tk.push(...list[j].tk);
      texts.push(tradOf(list[j].tk));
    }
    labels.set(i, { tk, texts });
    i += size;
  }
  return { starts, labels };
}

function setInstructions(list){
  state.instructions = list;
  const g = chunkInstructions(list, state.chunked);
  state.chunkStarts = g.starts;
  state.chunkLabels = g.labels;
}

function planRoute(row, col, facing, targetRow, targetCol, obstacles){
  const dirPath = bfsPath(row, col, targetRow, targetCol, obstacles);
  if(!dirPath) return null;
  return buildInstructionsFromRuns(compressRuns(dirPath), facing);
}

function planGame(dogStart, treasure, key, minObs, maxObs){
  const excluded = new Set([cellKey(dogStart.row,dogStart.col), cellKey(treasure.row,treasure.col)]);
  if(key) excluded.add(cellKey(key.row,key.col));
  for(let attempt=0; attempt<40; attempt++){
    const count = minObs + Math.floor(Math.random()*(maxObs-minObs+1));
    const obstacles = tryObstacles(excluded, count);
    if(key){
      const path1 = bfsPath(dogStart.row, dogStart.col, key.row, key.col, obstacles);
      if(!path1) continue;
      const path2 = bfsPath(key.row, key.col, treasure.row, treasure.col, obstacles);
      if(!path2) continue;
      return { obstacles, firstInstructions: buildInstructionsFromRuns(compressRuns(path1), 'down') };
    } else {
      const path = bfsPath(dogStart.row, dogStart.col, treasure.row, treasure.col, obstacles);
      if(!path) continue;
      return { obstacles, firstInstructions: buildInstructionsFromRuns(compressRuns(path), 'down') };
    }
  }
  const obstacles = new Set();
  const target = key || treasure;
  const path = bfsPath(dogStart.row, dogStart.col, target.row, target.col, obstacles);
  return { obstacles, firstInstructions: buildInstructionsFromRuns(compressRuns(path), 'down') };
}

// 各關設定。語速不再每關各自設定，改用 ⚙️ 的共用語速（上面的 RATE_VALUE）。
function difficultySettings(difficulty){
  if(difficulty === 'level2') return { minObs:15, maxObs:25, requiresKey:true, textHidden:false, chunked:false };
  if(difficulty === 'level3') return { minObs:20, maxObs:30, requiresKey:true, textHidden:true,  chunked:false };
  if(difficulty === 'level4') return { minObs:20, maxObs:30, requiresKey:true, textHidden:true,  chunked:true  };
  return { minObs:7, maxObs:15, requiresKey:false, textHidden:false, chunked:false };
}
const LEVEL_ORDER = ['level1','level2','level3','level4'];
const levelNum = lv => LEVEL_ORDER.indexOf(lv) + 1;

// ===== 計時：「時間」不算暫停；「思考時間」再扣掉語音播放的時間（選慢速的學生不會吃虧） =====
function clockTick(){
  const now = Date.now();
  if(state.clockOn && !state.paused){
    state.activeMs += now - state.clockLast;
    if(!state.speaking) state.thinkMs += now - state.clockLast;
  }
  state.clockLast = now;
}
function fmtMMSS(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}
function updateTimer(){
  clockTick();
  document.getElementById('timerDisp').textContent = fmtMMSS(state.activeMs/1000);
}

// ===== 語音 =====
let voice = null, voiceFallback = null, speechTok = 0;
function loadVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const norm = v => v.lang.replace('_','-').toLowerCase();
  voice = vs.find(v => norm(v) === 'zh-tw') || null;
  voiceFallback = vs.find(v => norm(v).startsWith('zh') && !/^(yue|zh-hk)/.test(norm(v))) || null;   // 排除廣東話
}
let voicesSeen = false;
function refreshVoiceNote(){
  let k = '';
  if(!('speechSynthesis' in window)) k = 'novoice';
  else if(voicesSeen && !voice) k = voiceFallback ? 'fallback' : 'novoice';
  ['voiceWarnGate','voiceWarnGame'].forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.toggle('hide', !k);
    el.innerHTML = k ? L(k) : '';
  });
}
if('speechSynthesis' in window){
  loadVoice();
  speechSynthesis.onvoiceschanged = () => { loadVoice(); voicesSeen = true; refreshVoiceNote(); };
  setTimeout(() => { loadVoice(); refreshVoiceNote(); }, 800);
  setTimeout(() => { loadVoice(); voicesSeen = true; refreshVoiceNote(); }, 2500);
}
// 「不算思考時間」的三種情況：語音正在唸、完成指令後的停頓、按錯後等錯誤訊息。任何一種成立就不計思考時間
function updateSpeaking(){ clockTick(); state.speaking = !!(state.speechOn || state.gapWait || state.errWait); }
function setSpeaking(on){ state.speechOn = on; updateSpeaking(); }
// 依序唸好幾句（第 4 關連續指令用），句子之間停一下；全部唸完才呼叫 onEnd
function speakSeq(texts, onEnd){
  const my = ++speechTok;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(!('speechSynthesis' in window) || !texts.length){
    setSpeaking(false);
    if(onEnd) setTimeout(() => { if(my === speechTok) onEnd(); }, 300);
    return;
  }
  setSpeaking(true);
  let i = 0;
  const next = () => {
    if(my !== speechTok) return;
    if(i >= texts.length){ if(IS_CRIOS && !USE_HTML_AUDIO) audioStale = true; setSpeaking(false); if(onEnd) onEnd(); return; }
    let u;
    try{
      u = new SpeechSynthesisUtterance(texts[i++]);
      u.lang = 'zh-TW';
      const v = voice || voiceFallback; if(v) u.voice = v;
      u.rate = RATE_VALUE[SETTINGS.rate] || RATE_VALUE.normal;
    }catch(e){ setSpeaking(false); if(onEnd) onEnd(); return; }
    let done = false;
    const fin = () => {
      if(done) return; done = true;
      if(my !== speechTok) return;
      if(i < texts.length) setTimeout(next, CHUNK_GAP[SETTINGS.rate] || CHUNK_GAP.normal);
      else next();
    };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 12000);   // 保險：有些瀏覽器不會觸發結束事件
    try{ window.speechSynthesis.speak(u); }catch(e){ fin(); }
  };
  setTimeout(next, 60);   // cancel 後馬上 speak，有些瀏覽器會吃掉，稍等一下
}
function stopSpeech(){
  speechTok++;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  setSpeaking(false);
}

// ===== 指令框 =====
function updateStageLabel(){
  const el = document.getElementById('stageLabel');
  const k = !state.requiresKey ? 'goalTreasure' : (state.stage === 'key' ? 'stageKey' : 'stageTreasure');
  el.innerHTML = L(k);
}
function curChunk(){ return state.chunkLabels.get(state.snapIndex); }
function renderBox(){
  const box = document.getElementById('instructionBox');
  if(state.box === 'idle'){ box.innerHTML = ''; return; }
  if(state.box === 'treasure'){ box.innerHTML = state.textHidden ? '🎉' : zhHtml(TREASURE_TK); return; }
  if(state.textHidden){ box.innerHTML = state.box === 'key' ? '🔑' : `<div class="listen">${L('listen')}</div>`; return; }
  if(state.box === 'key'){ box.innerHTML = zhHtml(KEY_TK); return; }
  const c = curChunk();
  box.innerHTML = c ? zhHtml(c.tk) : '';
}
// 顯示並唸出目前這一組指令（組的第一句才會觸發；同一組後面的句子不重唸）
function showCurrentInstruction(){
  if(state.curIndex >= state.instructions.length) return;
  if(!state.chunkStarts.has(state.curIndex)) return;
  state.box = 'ins';
  renderBox();
  const c = curChunk();
  if(c) speakSeq(c.texts);
}
// 重唸目前這一組（按錯、按 🔊、暫停回來時用）
// 完成一個指令後，先停一下（NEXT_GAP）再顯示並唸下一個；這段時間不算思考時間
function clearGapWait(){
  state.gapId++;
  if(state.gapWait){ state.gapWait = false; updateSpeaking(); }
}
function showNextInstructionAfterGap(){
  const gid = state.gameId;
  clearGapWait();
  const myGap = state.gapId;
  state.gapWait = true;
  updateSpeaking();
  state.box = 'idle';
  renderBox();
  setTimeout(() => {
    if(gid !== state.gameId || myGap !== state.gapId || !state.gapWait) return;
    state.gapWait = false;
    updateSpeaking();
    if(state.paused || !state.playing) return;   // 暫停中：按「繼續」時會自己把目前的指令再唸一次
    showCurrentInstruction();
  }, NEXT_GAP);
}
// 按錯後等待（ERR_WAIT）期間：可以繼續按鍵、按 🔊、暫停；一有動作就取消這次自動重唸
function clearErrWait(){
  if(state.errTimer){ clearTimeout(state.errTimer); state.errTimer = null; }
  if(state.errWait){ state.errWait = false; updateSpeaking(); }
}
function sayCurrentChunk(){
  if(!state.playing || state.paused || state.awaitingKeyAnnouncement) return;
  state.box = 'ins';
  renderBox();
  const c = curChunk();
  if(c) speakSeq(c.texts);
}

function snapshotInstruction(){
  state.snapshot = { row:state.dogRow, col:state.dogCol, facing:state.facing };
  state.snapIndex = state.curIndex;
}

function startGame(){
  ensureAudio();
  stopSpeech();
  clearGapWait();
  clearErrWait();
  clearHint();
  const gid = ++state.gameId;
  const difficulty = state.difficulty || 'level1';
  const settings = difficultySettings(difficulty);
  try{ window.HGPlays && HGPlays.start(difficulty, state.playerName); }catch(e){}

  const dogStart = randCell();
  let treasure = randCell();
  while(sameCell(treasure, dogStart)) treasure = randCell();
  let key = null;
  if(settings.requiresKey){
    key = randCell();
    while(sameCell(key, dogStart) || sameCell(key, treasure)) key = randCell();
  }
  const plan = planGame(dogStart, treasure, key, settings.minObs, settings.maxObs);

  state.difficulty = difficulty;
  state.requiresKey = settings.requiresKey;
  state.textHidden = settings.textHidden;
  state.chunked = settings.chunked;
  state.dogRow = dogStart.row;
  state.dogCol = dogStart.col;
  state.facing = 'down';
  state.treasureRow = treasure.row;
  state.treasureCol = treasure.col;
  state.treasureFound = false;
  state.keyRow = key ? key.row : null;
  state.keyCol = key ? key.col : null;
  state.keyFound = false;
  state.stage = settings.requiresKey ? 'key' : 'treasure';
  state.obstacles = plan.obstacles;
  state.errorCount = 0;
  state.totalPresses = 0;
  state.replays = 0;
  state.sameErr = 0;
  state.curIndex = 0;
  state.stepsDone = 0;
  setInstructions(plan.firstInstructions);
  state.playing = true;
  state.paused = false;
  state.awaitingKeyAnnouncement = false;
  state.keyAnnounceId = 0;
  setMobilePlayingCompact(true);

  updateCurrentLevelBadge();
  hideOverlays();
  document.getElementById('errorMsg').textContent = '';
  document.getElementById('errorDisp').textContent = '0';
  state.activeMs = 0; state.thinkMs = 0;
  state.clockLast = Date.now(); state.clockOn = true;
  if(state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(updateTimer, 500);
  updateTimer();
  updateCtlButtons();

  updateStageLabel();
  snapshotInstruction();
  showCurrentInstruction();
  draw();
  trackEvent('game_start', { level: state.difficulty });
  return gid;
}

function stopClock(){
  clockTick();
  state.clockOn = false;
  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
}

function checkGoal(){
  const gid = state.gameId;
  if(state.stage === 'key'){
    if(state.dogRow===state.keyRow && state.dogCol===state.keyCol){
      state.keyFound = true;
      draw();
      state.box = 'key';
      renderBox();
      const route = planRoute(state.dogRow, state.dogCol, state.facing, state.treasureRow, state.treasureCol, state.obstacles) || [];
      setInstructions(route);
      state.curIndex = 0;
      state.stepsDone = 0;
      state.stage = 'treasure';
      snapshotInstruction();
      updateStageLabel();
      clearHint();
      state.awaitingKeyAnnouncement = true;
      const myId = state.keyAnnounceId = Date.now() + Math.random();
      const proceed = () => {
        // 同一局、同一次宣布才繼續（避免重新開始或暫停後，舊的計時器又把指令唸出來）
        if(gid !== state.gameId || myId !== state.keyAnnounceId) return;
        state.keyAnnounceId = 0;
        state.awaitingKeyAnnouncement = false;
        if(state.paused) return;
        showCurrentInstruction();
      };
      speakSeq([tradOf(KEY_TK)], proceed);
      setTimeout(proceed, 12000);   // 保險：語音沒有正常結束時，最多等 12 秒
      trackEvent('stage_transition', { level: state.difficulty, from: 'key', to: 'treasure' });
      return true;
    }
    return false;
  }

  if(state.dogRow===state.treasureRow && state.dogCol===state.treasureCol){
    state.treasureFound = true;
    state.playing = false;
    stopClock();
    clearHint();
    updateCtlButtons();   // 手機版維持精簡模式（棋盤大小不變），回主選單時才還原
    const result = computeScore();
    state.box = 'treasure';
    renderBox();
    draw();
    trackEvent('level_complete', {
      level: state.difficulty,
      score: result.score,
      accuracy: Math.round(result.accuracy*100),
      time_spent: result.sec,
      think_per_step: Math.round(result.avgThink*10)/10,
      error_count: result.errors,
      replays: result.replays
    });
    playTreasureCelebration('恭喜，' + tradOf(TREASURE_TK), gid, () => showResult(result));
    return true;
  }
  return false;
}

// ===== 提示（只有第 1 關）：同一組指令連續錯 3 次，該按的方向鍵會亮起來 =====
function showHint(){
  const ins = state.instructions[state.curIndex];
  if(!ins) return;
  clearHint();
  const b = document.getElementById(DPAD_ID[ins.dir]);
  if(b) b.classList.add('hintGlow');
  document.getElementById('errorMsg').innerHTML = L('hint');
}
function clearHint(){
  document.querySelectorAll('#dpad .hintGlow').forEach(b => b.classList.remove('hintGlow'));
}

// 按錯：小狗回到「這一組」的起點，整組重唸（第 4 關連續指令也是整組重來）
function handleWrongKey(){
  const gid = state.gameId;
  state.errorCount++;
  state.sameErr++;
  document.getElementById('errorDisp').textContent = state.errorCount;
  document.getElementById('errorMsg').innerHTML = L('wrong');
  clearHint();
  state.dogRow = state.snapshot.row;
  state.dogCol = state.snapshot.col;
  state.facing = state.snapshot.facing;
  state.curIndex = state.snapIndex;
  state.stepsDone = 0;
  draw();
  clearErrWait();
  clearGapWait();
  state.errWait = true;
  updateSpeaking();   // 等待期間不算思考時間
  const errNo = state.errorCount;
  state.errTimer = setTimeout(() => {
    state.errTimer = null;
    if(gid !== state.gameId || !state.playing || errNo !== state.errorCount || !state.errWait) return;
    state.errWait = false;
    updateSpeaking();
    document.getElementById('errorMsg').textContent = '';
    if(state.paused) return;
    sayCurrentChunk();
    if(state.difficulty === 'level1' && state.sameErr >= 3) showHint();
  }, ERR_WAIT);
  setTimeout(() => trackEvent('error_made', { level: state.difficulty, stage: state.stage }), 0);   // 記錄資料不趕時間，晚一點點再做
}

function advanceInstruction(){
  state.curIndex++;
  state.stepsDone = 0;
  if(state.curIndex < state.instructions.length){
    if(state.chunkStarts.has(state.curIndex)){
      state.sameErr = 0;
      clearHint();
      document.getElementById('errorMsg').textContent = '';
      snapshotInstruction();
      showNextInstructionAfterGap();
    }
  } else {
    if(!checkGoal()){
      const target = state.stage === 'key'
        ? { row:state.keyRow, col:state.keyCol }
        : { row:state.treasureRow, col:state.treasureCol };
      const rerouted = planRoute(state.dogRow, state.dogCol, state.facing, target.row, target.col, state.obstacles);
      setInstructions(rerouted || []);
      state.curIndex = 0;
      snapshotInstruction();
      showNextInstructionAfterGap();
    }
  }
}

let audioCtx = null;
let sfxBuf = null;          // 事先做好的短音效（按鍵音 7 種音高＋錯誤音），按的時候直接播放，不用即時生成
function ensureAudio(){
  if(audioStale){
    audioStale = false;
    try{ if(audioCtx) audioCtx.close(); }catch(e){}
    audioCtx = null; sfxBuf = null;
  }
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      try{ audioCtx = new AC({ latencyHint:'interactive' }); }catch(e){ audioCtx = new AC(); }
    }
    if(audioCtx.state !== 'running' && audioCtx.resume) audioCtx.resume();
    if(!sfxBuf) buildSfx();
  }catch(e){}
  if(USE_HTML_AUDIO) buildHtmlSfx();
}
function toneSamples(freq, dur, type, gain, sr){
  const n = Math.max(1, Math.floor(sr * dur)), d = new Float32Array(n);
  for(let i = 0; i < n; i++){
    const t = i / sr, ph = (t * freq) % 1;
    const w = type === 'square' ? (ph < 0.5 ? 1 : -1) : Math.sin(2 * Math.PI * ph);
    d[i] = w * gain * Math.pow(0.001 / gain, t / dur);   // 和原本一樣：指數衰減到 0.001
  }
  return d;
}
function renderTone(freq, dur, type, gain){
  const sr = audioCtx.sampleRate, d = toneSamples(freq, dur, type, gain, sr);
  const buf = audioCtx.createBuffer(1, d.length, sr);
  buf.getChannelData(0).set(d);
  return buf;
}
// ===== 備用播放方式：用一般的 <audio> 播放（iPhone 的 Chrome 上 Web Audio 會變成沒聲音）=====
// 只在 iPhone 的 Chrome 啟用（或網址加 ?audio=html 強制測試）；Safari 和其他瀏覽器維持原本的 Web Audio
const IS_CRIOS = /CriOS/.test(navigator.userAgent);
const AUDIO_PARAM = (location.search.match(/[?&]audio=(web|html)\b/) || [])[1] || null;   // 網址 ?audio=web / ?audio=html 可強制切換，方便比較
const USE_HTML_AUDIO = AUDIO_PARAM ? AUDIO_PARAM === 'html' : IS_CRIOS;
// 音效大小倍數：iPhone 的 Chrome 輸出比 Safari 小聲，所以放大；網址 ?vol=3 可自行調整（0.5～4）
const _vp = parseFloat((location.search.match(/[?&]vol=([0-9.]+)/) || [])[1]);
const SFX_VOL = isFinite(_vp) ? Math.min(4, Math.max(0.5, _vp)) : (IS_CRIOS ? 4 : 1);
const sfxGain = g => Math.min(0.9, g * SFX_VOL);
let audioStale = false;   // iPhone Chrome：語音唸完後 Web Audio 通道可能被系統關掉，下一次按鍵時重建
let htmlSfx = null;
function makeWavUrl(samples, sr){
  const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  for(let i = 0; i < n; i++){ const s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return URL.createObjectURL(new Blob([buf], { type:'audio/wav' }));
}
function makeHtmlEntry(freq, dur, type, gain){
  const url = makeWavUrl(toneSamples(freq, dur, type, gain, 44100), 44100);
  const pool = [];
  for(let i = 0; i < 3; i++){ const a = new Audio(url); a.preload = 'auto'; pool.push(a); }   // 連按時輪流用，避免上一聲還沒播完被打斷
  return { pool, i: 0 };
}
function buildHtmlSfx(){
  if(htmlSfx) return;
  try{
    htmlSfx = { beep: [], err: makeHtmlEntry(220, 0.22, 'square', sfxGain(0.18)) };
    for(let k = 0; k <= 6; k++) htmlSfx.beep.push(makeHtmlEntry(900 + k * 90, 0.12, 'sine', sfxGain(0.22)));
  }catch(e){ htmlSfx = null; }
}
function playHtmlEntry(entry){
  try{
    buildHtmlSfx();
    if(!entry) return;
    const a = entry.pool[entry.i++ % entry.pool.length];
    try{ a.currentTime = 0; }catch(e){}
    const p = a.play(); if(p && p.catch) p.catch(() => {});
  }catch(e){}
}
function buildSfx(){
  sfxBuf = { beep: [], err: renderTone(220, 0.22, 'square', sfxGain(0.18)) };
  for(let k = 0; k <= 6; k++) sfxBuf.beep.push(renderTone(900 + k * 90, 0.12, 'sine', sfxGain(0.22)));
}
function playBuf(buf){
  try{
    ensureAudio();
    if(!audioCtx || !buf) return;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
  }catch(e){}
}
function playTone(freq, duration, type, gain){
  try{
    ensureAudio();
    if(!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + duration);
  }catch(e){}
}
function playBeep(pressIndex){
  if(USE_HTML_AUDIO){ buildHtmlSfx(); if(htmlSfx){ playHtmlEntry(htmlSfx.beep[Math.min(pressIndex || 0, 6)]); return; } }
  if(sfxBuf) playBuf(sfxBuf.beep[Math.min(pressIndex || 0, 6)]);
  else playTone(900 + Math.min(pressIndex || 0, 6)*90, 0.12, 'sine', 0.22);
}
function playErrorTone(){
  if(USE_HTML_AUDIO){ buildHtmlSfx(); if(htmlSfx){ playHtmlEntry(htmlSfx.err); return; } }
  if(sfxBuf) playBuf(sfxBuf.err);
  else playTone(220, 0.22, 'square', 0.18);
}

// ===== 診斷畫面：網址後面加 ?debug=1 才出現，平常完全不執行 =====
const DBG = /[?&]debug=1\b/.test(location.search);
const dbg = { inp:[], hand:[], draw:[], next:[], fps:[], presses:0, worstFrame:0 };
function dbgPush(a, v){ a.push(v); if(a.length > 40) a.shift(); }
function dbgStat(a){ if(!a.length) return '-'; const last = a[a.length-1], avg = a.reduce((x,y)=>x+y,0)/a.length, max = Math.max.apply(null, a); return last.toFixed(0) + ' / ' + avg.toFixed(0) + ' / ' + max.toFixed(0); }
function dbgBefore(e){
  if(!DBG) return 0;
  const now = performance.now();
  const ts = e && e.timeStamp ? e.timeStamp : now;
  dbgPush(dbg.inp, Math.max(0, (ts > 1e12 ? Date.now() : now) - ts));   // 手指碰到螢幕 → 程式開始處理，隔了多久
  return now;
}
function dbgAfter(t0){
  if(!DBG || !t0) return;
  const t1 = performance.now();
  dbg.presses++;
  dbgPush(dbg.hand, t1 - t0);                                            // 程式處理這一下花多久
  requestAnimationFrame(() => dbgPush(dbg.next, performance.now() - t0)); // 按下 → 下一幀畫面更新，隔了多久
}
if(DBG){
  const box = document.createElement('div');
  box.id = 'dbg';
  box.style.cssText = 'position:fixed;left:4px;bottom:4px;z-index:5000;background:rgba(0,0,0,.78);color:#9fffb0;font:10px/1.35 monospace;padding:5px 7px;border-radius:6px;pointer-events:none;white-space:pre;max-width:96vw';
  document.body.appendChild(box);
  let last = performance.now();
  const loop = t => { const d = t - last; last = t; if(d < 1000){ dbgPush(dbg.fps, d); if(d > dbg.worstFrame) dbg.worstFrame = d; } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  setInterval(() => {
    const frameAvg = dbg.fps.length ? dbg.fps.reduce((x,y)=>x+y,0)/dbg.fps.length : 0;
    const ua = /CriOS/.test(navigator.userAgent) ? 'Chrome(iOS)' : (/Safari/.test(navigator.userAgent) ? 'Safari/其他' : '?');
    const ac = (USE_HTML_AUDIO ? '音效方式=一般播放器(<audio>) ' : '音效方式=Web Audio' + (IS_CRIOS ? '(語音後重建) ' : ' ')) + (audioCtx ? (audioCtx.state + ' base=' + ((audioCtx.baseLatency || 0)*1000).toFixed(0) + 'ms out=' + ((audioCtx.outputLatency || 0)*1000).toFixed(0) + 'ms ' + audioCtx.sampleRate + 'Hz') : '(音訊尚未啟動)');
    box.textContent = 'DEBUG ' + ua + '  按鍵 ' + dbg.presses + ' 次\n'
      + '音訊 ' + ac + '\n'
      + '輸入延遲(碰螢幕→收到) ms 最近/平均/最大: ' + dbgStat(dbg.inp) + '\n'
      + '處理(含音效+移動+重畫): ' + dbgStat(dbg.hand) + '\n'
      + '重畫棋盤: ' + dbgStat(dbg.draw) + '\n'
      + '按下→下一幀畫面: ' + dbgStat(dbg.next) + '\n'
      + '每幀間隔 平均 ' + frameAvg.toFixed(0) + 'ms(≈' + (frameAvg ? (1000/frameAvg).toFixed(0) : '-') + 'fps) 最慢 ' + dbg.worstFrame.toFixed(0) + 'ms';
  }, 400);
}

function pressDirection(dir){
  if(!state.playing){ playBeep(0); return; }
  if(state.paused) return;
  if(state.awaitingKeyAnnouncement) return; // 「找到鑰匙了」的語音還沒講完，先忽略操作，避免蓋過去
  if(state.gapWait) return;                 // 還沒聽到下一個指令，先不收按鍵（避免亂算錯誤）
  if(state.curIndex >= state.instructions.length) return;
  const ins = state.instructions[state.curIndex];
  if(dir !== ins.dir){
    playErrorTone();
    handleWrongKey();
    return;
  }
  clearHint();
  if(state.errWait){ clearErrWait(); document.getElementById('errorMsg').textContent = ''; }   // 按對了：取消這次自動重唸、收起錯誤訊息
  state.totalPresses++;
  if(ins.kind === 'turn'){
    playBeep(0);
    state.facing = dir;
    requestDraw();
    advanceInstruction();
  } else {
    playBeep(state.stepsDone);
    const d = DELTA[dir];
    state.dogRow += d.dr;
    state.dogCol += d.dc;
    state.stepsDone++;
    requestDraw();
    if(checkGoal()) return;
    if(state.stepsDone >= ins.steps) advanceInstruction();
  }
}

function handleKey(e){
  const dir = KEYMAP[e.key];
  if(!dir) return;
  if(document.body.classList.contains('gate-open')) return;
  if(!document.getElementById('setov').classList.contains('hide')) return;
  e.preventDefault();
  pressDirection(dir);
}
document.addEventListener('keydown', handleKey);

function bindDpad(id, dir){
  const el = document.getElementById(id);
  el.addEventListener('click', e => { const t0 = dbgBefore(e); pressDirection(dir); dbgAfter(t0); });
  el.addEventListener('touchstart', e => { e.preventDefault(); const t0 = dbgBefore(e); pressDirection(dir); dbgAfter(t0); }, {passive:false});
}
bindDpad('dpadUp','up');
bindDpad('dpadDown','down');
bindDpad('dpadLeft','left');
bindDpad('dpadRight','right');

// ---------- Drawing ----------
// 棋盤的格線和石頭不會動，只畫一次存成底圖；之後每次重畫只要貼上底圖，再畫小狗／鑰匙／寶藏
let bgCanvas = null, bgFor = null;
function drawStaticLayer(){
  // 美漫風格棋盤：奶油色紙，隔格有淡紅網點
  const dotR = Math.max(.6, CELL*.05);
  ctx.fillStyle = CM.paper;   // 先整片鋪底：格子邊緣在小數位置時才不會露出半透明縫，而且重畫的結果每次都一樣
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for(let r=0;r<GRID;r++){
    for(let c=0;c<GRID;c++){
      const alt = (r+c)%2 === 1;
      ctx.fillStyle = alt ? CM.paperAlt : CM.paper;
      ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
      if(alt){
        ctx.fillStyle = 'rgba(230,57,70,.16)';
        ctx.beginPath();
        for(let a=0;a<3;a++) for(let b=0;b<3;b++){
          const x = c*CELL + CELL*(a+.5)/3, y = r*CELL + CELL*(b+.5)/3;
          ctx.moveTo(x+dotR, y); ctx.arc(x, y, dotR, 0, Math.PI*2);
        }
        ctx.fill();
      }
    }
  }
  ctx.strokeStyle = CM.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0;i<=GRID;i++){
    ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL, GRID*CELL);
    ctx.moveTo(0,i*CELL); ctx.lineTo(GRID*CELL, i*CELL);
  }
  ctx.stroke();
  state.obstacles.forEach(key=>{
    const [r,c] = key.split(',').map(Number);
    drawObstacle(c*CELL+CELL/2, r*CELL+CELL/2);
  });
}
function drawBoardBase(){
  if(!bgCanvas) bgCanvas = document.createElement('canvas');
  const ok = bgFor && bgFor.obs === state.obstacles && bgFor.obsSize === state.obstacles.size && bgFor.w === canvas.width && bgFor.cell === CELL;
  if(ok){ ctx.drawImage(bgCanvas, 0, 0); return; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);   // 先清乾淨，格線邊緣的半透明像素才不會一層層疊深
  drawStaticLayer();   // 先照原樣畫在棋盤上，再把這張圖存起來給之後用
  bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
  bgCanvas.getContext('2d').drawImage(canvas, 0, 0);
  bgFor = { obs:state.obstacles, obsSize:state.obstacles.size, w:canvas.width, cell:CELL };
}
// 連續快按時，多次移動合併成「約每一幀只重畫一次」，不會越排越長
let lastDrawAt = 0, drawQueued = false;
function requestDraw(){
  const now = performance.now();
  if(now - lastDrawAt > 16){ draw(); return; }
  if(drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; draw(); });
}
function draw(){
  const t0 = DBG ? performance.now() : 0;
  drawBoardBase();
  if(state.requiresKey && state.keyFound){
    drawKey(state.keyCol*CELL+CELL/2, state.keyRow*CELL+CELL/2);
  }
  if(state.treasureFound){
    drawTreasure(state.treasureCol*CELL+CELL/2, state.treasureRow*CELL+CELL/2);
  }
  drawDog(state.dogCol*CELL+CELL/2, state.dogRow*CELL+CELL/2, state.facing);
  lastDrawAt = performance.now();
  if(DBG) dbgPush(dbg.draw, lastDrawAt - t0);
}

// ===== 美漫風格繪圖：粗黑外框、鮮明平塗色、網點。所有尺寸都以「一格」為單位，s = 格子大小 =====
const CM = {
  line:'#1A1A1A', paper:'#FFF3C4', paperAlt:'#FFE9A0', grid:'rgba(26,26,26,.28)',
  body:'#8A5A33', ear:'#4E2F18', muzzle:'#F3D2A2', nose:'#1A1A1A', tongue:'#FF6B8B', collar:'#E63946',
  stone:'#A9B3BE', stoneDark:'#6F7A86', gold:'#FFC62B', goldDark:'#E08E0B', wood:'#B8671F', woodDark:'#7C3F10'
};
function cmFill(c, col, lw){ c.fillStyle = col; c.fill(); c.lineWidth = lw; c.strokeStyle = CM.line; c.stroke(); }
function cmEll(c, s, x, y, rx, ry, rot, col, lw){ c.beginPath(); c.ellipse(x*s, y*s, rx*s, ry*s, rot, 0, Math.PI*2); cmFill(c, col, lw); }
function cmEye(c, s, x, y, r){
  c.beginPath(); c.arc(x*s, y*s, r*s*1.15, 0, Math.PI*2); c.fillStyle = '#fff'; c.fill();
  c.lineWidth = Math.max(1, s*.045); c.strokeStyle = CM.line; c.stroke();
  c.beginPath(); c.arc((x + r*.18)*s, y*s, r*s*.62, 0, Math.PI*2); c.fillStyle = CM.line; c.fill();
  c.beginPath(); c.arc((x + r*.3)*s, (y - r*.3)*s, r*s*.22, 0, Math.PI*2); c.fillStyle = '#fff'; c.fill();
}

// 小狗：圓臉小狗，上／下／左／右四個面向
function cmDog(c, x, y, s, f){
  c.save(); c.translate(x, y); c.lineJoin = 'round'; c.lineCap = 'round';
  const lw = Math.max(1.3, s*.07);
  if(f === 'left' || f === 'right'){
    if(f === 'left') c.scale(-1, 1);
    cmEll(c, s, -.42, -.06, .075, .17, -.55, CM.body, lw);                 // 尾巴
    cmEll(c, s, -.30, .34, .075, .10, 0, CM.ear, lw); cmEll(c, s, .06, .34, .075, .10, 0, CM.ear, lw);   // 腳
    cmEll(c, s, -.10, .14, .34, .20, 0, CM.body, lw);                      // 身體
    cmEll(c, s, .16, -.08, .27, .26, 0, CM.body, lw);                      // 頭
    cmEll(c, s, .41, .0, .16, .115, 0, CM.muzzle, lw);                     // 口鼻
    cmEll(c, s, .55, -.03, .05, .04, 0, CM.nose, lw*.6);                   // 鼻子
    cmEll(c, s, .40, .11, .05, .06, 0, CM.tongue, lw*.7);                  // 舌頭
    cmEll(c, s, .07, -.07, .09, .19, .25, CM.ear, lw);                     // 耳朵
    cmEll(c, s, .0, .12, .05, .13, -.15, CM.collar, lw*.7);                // 項圈
    cmEye(c, s, .24, -.15, .075);
  }else if(f === 'down'){
    cmEll(c, s, 0, .33, .24, .17, 0, CM.body, lw);
    cmEll(c, s, -.12, .47, .08, .05, 0, CM.muzzle, lw*.8); cmEll(c, s, .12, .47, .08, .05, 0, CM.muzzle, lw*.8);
    cmEll(c, s, -.31, -.08, .13, .25, .35, CM.ear, lw); cmEll(c, s, .31, -.08, .13, .25, -.35, CM.ear, lw);
    cmEll(c, s, 0, -.04, .34, .31, 0, CM.body, lw);
    cmEll(c, s, 0, .31, .17, .05, 0, CM.collar, lw*.7);
    cmEll(c, s, 0, .12, .17, .125, 0, CM.muzzle, lw);
    cmEll(c, s, 0, .23, .05, .065, 0, CM.tongue, lw*.7);
    cmEll(c, s, 0, .07, .065, .045, 0, CM.nose, lw*.6);
    cmEye(c, s, -.15, -.09, .08); cmEye(c, s, .15, -.09, .08);
  }else{ // up：背面
    cmEll(c, s, 0, .34, .075, .09, 0, CM.body, lw);
    cmEll(c, s, 0, .28, .24, .17, 0, CM.body, lw);
    cmEll(c, s, -.31, -.06, .13, .25, .35, CM.ear, lw); cmEll(c, s, .31, -.06, .13, .25, -.35, CM.ear, lw);
    cmEll(c, s, 0, -.04, .34, .31, 0, CM.body, lw);
    cmEll(c, s, .10, -.10, .10, .08, .3, CM.muzzle, lw*.8);
    cmEll(c, s, 0, .29, .17, .05, 0, CM.collar, lw*.7);
  }
  c.restore();
}

function cmStone(c, x, y, s){
  c.save(); c.translate(x, y); c.lineJoin = 'round';
  const lw = Math.max(1.3, s*.07);
  const pts = [[-.36,.06],[-.28,-.2],[-.04,-.34],[.24,-.26],[.38,.0],[.3,.26],[.0,.34],[-.26,.28]];
  const path = () => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0]*s, p[1]*s) : c.moveTo(p[0]*s, p[1]*s)); c.closePath(); };
  path(); c.fillStyle = CM.stone; c.fill();
  c.save(); c.clip();
  c.fillStyle = CM.stoneDark; c.beginPath(); c.moveTo(.4*s, -.1*s); c.lineTo(.4*s, .4*s); c.lineTo(-.4*s, .4*s); c.lineTo(-.1*s, .1*s); c.closePath(); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-.26*s, -.1*s); c.lineTo(-.1*s, -.24*s); c.lineTo(.02*s, -.2*s); c.lineTo(-.14*s, -.06*s); c.closePath(); c.fill();
  c.restore();
  path(); c.lineWidth = lw; c.strokeStyle = CM.line; c.stroke();
  c.restore();
}

function cmKey(c, x, y, s){
  c.save(); c.translate(x, y); c.rotate(-Math.PI/4); c.lineJoin = 'round';
  const lw = Math.max(1.3, s*.07);
  c.beginPath(); c.rect(-.1*s, -.06*s, .52*s, .12*s); cmFill(c, CM.gold, lw);
  c.beginPath(); c.rect(.24*s, .04*s, .09*s, .16*s); cmFill(c, CM.gold, lw);
  c.beginPath(); c.rect(.36*s, .04*s, .09*s, .12*s); cmFill(c, CM.gold, lw);
  c.beginPath(); c.arc(-.22*s, 0, .17*s, 0, Math.PI*2); cmFill(c, CM.gold, lw);
  c.beginPath(); c.arc(-.22*s, 0, .07*s, 0, Math.PI*2); c.fillStyle = CM.paper; c.fill(); c.lineWidth = lw*.8; c.strokeStyle = CM.line; c.stroke();
  c.beginPath(); c.moveTo(-.33*s, -.1*s); c.lineTo(-.26*s, -.15*s); c.strokeStyle = '#fff'; c.lineWidth = lw*.9; c.stroke();
  c.restore();
}

function cmChest(c, x, y, s){
  c.save(); c.translate(x, y); c.lineJoin = 'round';
  const lw = Math.max(1.3, s*.07);
  c.beginPath(); c.roundRect(-.36*s, -.02*s, .72*s, .36*s, .04*s); cmFill(c, CM.wood, lw);
  c.beginPath(); c.moveTo(-.36*s, -.02*s); c.quadraticCurveTo(-.36*s, -.34*s, 0, -.34*s); c.quadraticCurveTo(.36*s, -.34*s, .36*s, -.02*s); c.closePath(); cmFill(c, CM.woodDark, lw);
  c.beginPath(); c.rect(-.26*s, -.3*s, .08*s, .62*s); cmFill(c, CM.gold, lw*.8);
  c.beginPath(); c.rect(.18*s, -.3*s, .08*s, .62*s); cmFill(c, CM.gold, lw*.8);
  c.beginPath(); c.roundRect(-.07*s, -.08*s, .14*s, .16*s, .03*s); cmFill(c, CM.gold, lw*.8);
  c.beginPath(); c.arc(0, 0, .02*s, 0, Math.PI*2); c.fillStyle = CM.line; c.fill();
  c.restore();
}

function cmCoin(c, x, y, r){
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fillStyle = CM.gold; c.fill(); c.lineWidth = Math.max(1.3, r*.28); c.strokeStyle = CM.line; c.stroke();
  c.beginPath(); c.arc(x, y, r*.55, 0, Math.PI*2); c.lineWidth = Math.max(1, r*.15); c.strokeStyle = CM.goldDark; c.stroke();
}
function cmChestOpen(c, x, y, s){
  c.save(); c.translate(x, y); c.lineJoin = 'round';
  const lw = Math.max(1.3, s*.06);
  c.beginPath(); c.moveTo(-.36*s, -.1*s); c.lineTo(-.30*s, -.52*s); c.quadraticCurveTo(0, -.64*s, .30*s, -.52*s); c.lineTo(.36*s, -.1*s); c.closePath(); cmFill(c, CM.woodDark, lw);
  c.beginPath(); c.rect(-.26*s, -.56*s, .08*s, .44*s); cmFill(c, CM.gold, lw*.8);
  c.beginPath(); c.rect(.18*s, -.56*s, .08*s, .44*s); cmFill(c, CM.gold, lw*.8);
  c.beginPath(); c.ellipse(0, -.08*s, .36*s, .10*s, 0, 0, Math.PI*2); c.fillStyle = '#FFF7B0'; c.fill(); c.lineWidth = lw; c.strokeStyle = CM.line; c.stroke();
  [[-.22,-.14],[-.08,-.2],[.08,-.16],[.22,-.12],[0,-.1],[-.14,-.08],[.14,-.06]].forEach(p => cmCoin(c, p[0]*s, p[1]*s, .1*s));
  c.beginPath(); c.roundRect(-.36*s, -.02*s, .72*s, .38*s, .04*s); cmFill(c, CM.wood, lw);
  c.beginPath(); c.rect(-.26*s, -.02*s, .08*s, .38*s); cmFill(c, CM.gold, lw*.8);
  c.beginPath(); c.rect(.18*s, -.02*s, .08*s, .38*s); cmFill(c, CM.gold, lw*.8);
  c.beginPath(); c.roundRect(-.07*s, .02*s, .14*s, .16*s, .03*s); cmFill(c, CM.gold, lw*.8);
  c.beginPath(); c.arc(0, .1*s, .02*s, 0, Math.PI*2); c.fillStyle = CM.line; c.fill();
  c.restore();
}
function cmDogHappy(c, x, y, s){
  const lw = Math.max(1.3, s*.07);
  c.save(); c.translate(x, y); c.lineJoin = 'round'; c.lineCap = 'round';
  cmEll(c, s, -.40, 0, .075, .14, .35, CM.body, lw); cmEll(c, s, .40, 0, .075, .14, -.35, CM.body, lw);   // 舉高的前腳
  c.restore();
  cmDog(c, x, y, s, 'down');
  c.save(); c.translate(x, y); c.lineCap = 'round';
  [-.15, .15].forEach(ex => {   // 把眼睛蓋掉，畫成笑瞇瞇的 ^ ^
    c.beginPath(); c.arc(ex*s, -.09*s, .12*s, 0, Math.PI*2); c.fillStyle = CM.body; c.fill();
    c.beginPath(); c.arc(ex*s, -.07*s, .075*s, Math.PI*1.1, Math.PI*1.9); c.lineWidth = Math.max(1.5, s*.05); c.strokeStyle = CM.line; c.stroke();
  });
  c.beginPath(); c.ellipse(0, .165*s, .095*s, .06*s, 0, 0, Math.PI); c.fillStyle = '#7A1F2B'; c.fill(); c.lineWidth = Math.max(1.2, s*.04); c.strokeStyle = CM.line; c.stroke();
  c.beginPath(); c.ellipse(0, .2*s, .05*s, .028*s, 0, 0, Math.PI); c.fillStyle = CM.tongue; c.fill();
  c.restore();
}
function cmSparkle(c, x, y, r){
  c.beginPath();
  for(let i = 0; i < 8; i++){ const a = i*Math.PI/4, rr = i % 2 ? r*.38 : r; c.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr); }
  c.closePath(); c.fillStyle = '#FFE45E'; c.fill(); c.lineWidth = 1.3; c.strokeStyle = CM.line; c.stroke();
}
function cmBurst(c, x, y, r, col, txt){
  c.save(); c.translate(x, y); c.rotate(-.12);
  c.beginPath();
  for(let i = 0; i < 24; i++){ const a = i*Math.PI/12, rr = i % 2 ? r*.72 : r; c.lineTo(Math.cos(a)*rr*1.25, Math.sin(a)*rr*.9); }
  c.closePath(); c.fillStyle = col; c.fill(); c.lineWidth = 3; c.strokeStyle = CM.line; c.stroke();
  c.fillStyle = CM.line; c.font = '900 ' + Math.round(r*.55) + 'px "Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = 4; c.strokeStyle = '#fff'; c.strokeText(txt, 0, 2); c.fillText(txt, 0, 2);
  c.restore();
}
// 找到寶藏的慶祝畫面（兩格輪流）：以 370 為基準大小，再依棋盤實際大小縮放，疊在棋盤上
function cmFoundScene(t){
  const W = 370, k = canvas.width / W, cx = W/2, cy = W/2 + 8, c = ctx;
  c.save(); c.scale(k, k);
  c.save(); c.beginPath(); c.rect(0, 0, W, W); c.clip();
  for(let i = 0; i < 20; i++){
    const a = i*Math.PI/10;
    c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, W, a, a + Math.PI/20); c.closePath();
    c.fillStyle = ((i + t) % 2) ? 'rgba(255,214,64,.55)' : 'rgba(255,255,255,0)'; c.fill();
  }
  c.restore();
  c.fillStyle = 'rgba(255,243,196,.55)'; c.fillRect(W*.14, W*.2, W*.72, W*.62);
  const up = t ? -9 : 0;
  if(t){ [[cx+22,cy-64,9],[cx+66,cy-96,8],[cx+98,cy-58,9],[cx+44,cy-122,7]].forEach(p => cmCoin(c, p[0], p[1], p[2])); }   // 飛出來的金幣
  cmChestOpen(c, cx + 52, cy + 22, 150);
  cmDogHappy(c, cx - 62, cy + 34 + up, 118);
  const sp = t
    ? [[cx-120,cy-30,18],[cx+132,cy-20,14],[cx-40,cy-112,12],[cx+8,cy+112,16],[cx-146,cy+80,12]]
    : [[cx-130,cy-80,16],[cx+120,cy-90,20],[cx+10,cy-120,14],[cx-20,cy+104,12],[cx+140,cy+60,12]];
  sp.forEach(p => cmSparkle(c, p[0], p[1], p[2]));
  cmBurst(c, cx - 6, cy - 138, t ? 54 : 48, t ? '#FFB400' : '#FF6B57', '找到了！');
  c.restore();
}

// 把一小張美漫圖畫在 <canvas> 上（開始頁圖案列、結算畫面、暫停視窗用）
function cmSprite(cv, w, h, fn){
  if(!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  cv.style.aspectRatio = w + ' / ' + h;
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  fn(c);
}

// gid：這一局的編號，重新開始後舊的慶祝會自己停掉
function playTreasureCelebration(speechText, gid, onDone){
  let step = 0;
  let finished = false;
  function renderFrame(){
    if(finished) return;
    if(gid !== state.gameId){ finished = true; clearInterval(timer); return; }
    drawBoardBase();              // 只畫棋盤底圖（石頭、格子），原本的小狗、鑰匙、寶藏不畫，免得隱約透出來
    cmFoundScene(step % 2);
    step++;
  }
  renderFrame();
  const timer = setInterval(renderFrame, 375);

  function finish(){
    if(finished) return;
    finished = true;
    clearInterval(timer);
    if(gid === state.gameId) onDone();
  }
  speakSeq([speechText], finish);
  setTimeout(finish, 12000);   // 保險：語音沒有正常結束時，最多等 12 秒
}

// 棋盤尺寸只依「視窗大小」計算，完全不受右側資訊欄（結果／錯誤訊息等）高度變化影響。
// 手機版（<=700px）改成直式堆疊＋整頁可捲動，棋盤大小主要依螢幕「寬度」決定，再用高度夾一次。
let boardSizeCache = null;
// 100svh = 手機瀏覽器網址列、工具列都顯示時的可視高度，不會因為滑動頁面而跳動
function stableViewportHeight(){
  let h = 0;
  try{
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:100svh;visibility:hidden;pointer-events:none;';
    document.body.appendChild(probe);
    h = probe.offsetHeight;
    probe.remove();
  }catch(e){}
  return h > 0 ? h : window.innerHeight;
}
function computeBoardSize(){
  const isMobileLayout = window.matchMedia('(max-width: 700px)').matches;
  const wrapChrome = 26;   // #boardWrap 的 padding(10*2) + border(3*2) 近似值

  const insBox = document.getElementById('instructionBox');
  if(!isMobileLayout){
    if(insBox) insBox.style.minHeight = '';
    const st = document.getElementById('stageLabel'); if(st) st.style.minHeight = '';
  }
  if(isMobileLayout){
    // 手機版：棋盤大小要「整局固定」，不能跟著網址列／工具列收合而忽大忽小，又要盡量用滿寬度。
    // 1) 高度用 100svh（工具列都顯示時的高度）這個固定值，不用會跳動的 innerHeight。
    // 2) 指令框、第幾步的高度會隨內容變，改成固定最小高度（先預留好）。
    // 3) 不用估算：量「整個畫面現在用掉多少高度」，剩下多少就全部給棋盤（上限是滿寬）。
    // 4) 算過一次就記起來；只有寬度（轉向）、語言／拼音／繁簡設定、進出遊戲改變時才重算。
    const frame = 16;   // 棋盤外框：左右各 padding 6 + border 2
    const playing = document.body.classList.contains('mobile-playing');
    const key = [window.innerWidth, SETTINGS.lang, SETTINGS.phon, SETTINGS.script, playing].join('|');
    if(boardSizeCache && boardSizeCache.key === key) return boardSizeCache.size;
    const maxContent = Math.max(180, Math.min(window.innerWidth - 20, 420) - frame);
    const ga = document.getElementById('gameArea');
    if(!playing || !ga || ga.offsetHeight === 0) return Math.floor(Math.min(maxContent, 300));   // 還沒進遊戲：不精算、也不記住
    const insMin = SETTINGS.phon === 'both' ? 78 : (SETTINGS.phon === 'off' ? 52 : 64);
    if(insBox) insBox.style.minHeight = insMin + 'px';
    const st = document.getElementById('stageLabel'); if(st) st.style.minHeight = '20px';
    const padBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    const used = ga.getBoundingClientRect().bottom + window.scrollY + padBottom;   // 整頁現在需要的高度
    const leftover = stableViewportHeight() - used - 2;
    let size = Math.floor(Math.min(maxContent, canvas.width + leftover));
    size = Math.max(160, size);
    boardSizeCache = { key, size };
    return size;
  }

  const panel = document.getElementById('panel');
  const gameArea = document.getElementById('gameArea');
  const boardWrap = document.getElementById('boardWrap');
  const gap = 14;
  const panelWidth = (panel && panel.getBoundingClientRect().width) || 280;
  const areaRect = gameArea ? gameArea.getBoundingClientRect() : null;
  const areaHeight = areaRect ? areaRect.height : (window.innerHeight - 28);
  let headerHeight = 0;
  if(boardWrap){
    const h1El = boardWrap.querySelector('h1');
    const sealEl = boardWrap.querySelector('.seal');
    if(h1El) headerHeight += h1El.getBoundingClientRect().height;
    if(sealEl) headerHeight += sealEl.getBoundingClientRect().height;
    if(h1El || sealEl) headerHeight += 14;
  }
  const availableWidth = window.innerWidth - panelWidth - gap - 28 - wrapChrome;
  const availableHeight = areaHeight - wrapChrome - headerHeight;
  let size = Math.min(availableWidth, availableHeight);
  size = Math.max(240, Math.min(size, 640));
  return Math.floor(size);
}

function syncBoardHeight(){
  const size = computeBoardSize();
  canvas.width = size;
  canvas.height = size;
  CELL = size / GRID;
  draw();
}

// ===== 分數 =====
// 分數以「正確率」為主分，「每步平均思考時間」只作小幅扣分；思考時間不含語音播放與暫停，
// 所以選慢速語音、多按幾次 🔊 都不會被扣分。避免玩家用亂按方向鍵的方式衝快。
function computeScore(){
  const sec = Math.floor(state.activeMs / 1000);
  const totalPresses = state.totalPresses || 0;
  const errors = state.errorCount || 0;
  const accuracy = totalPresses > 0 ? totalPresses / (totalPresses + errors) : 0;
  const thinkSec = state.thinkMs / 1000;
  const avgThink = totalPresses > 0 ? thinkSec / totalPresses : thinkSec;
  let score = Math.round(accuracy * 1000 - avgThink * 50);
  score = Math.max(0, Math.min(1000, score));
  return { sec, thinkSec, totalPresses, errors, accuracy, avgThink, score, replays: state.replays || 0 };
}
// 評語：依正確率分五級（一次都沒錯 → 完美）
function commentKey(r){
  if(r.errors === 0) return 'k4';
  return r.accuracy >= 0.9 ? 'k3' : r.accuracy >= 0.75 ? 'k2' : r.accuracy >= 0.5 ? 'k1' : 'k0';
}

// 結果畫面順序（與色數、比比看統一）：分數 → 評語 → 排行榜 → 再玩一次／下一關 → 主選單

// ===== 排行榜（Firebase，下面的 module 提供 window.LB） =====
// 每台裝置（匿名登入）每一關只留一筆最高分；只顯示前 10 名
async function waitLB(){
  for(let i = 0; i < 50 && !window.LB; i++) await new Promise(r => setTimeout(r, 100));
  return window.LB || null;
}
function lbTable(list, myUid){
  if(!list.length) return `<p class="lbStatus">${L('lbEmpty')}</p>`;
  const medals = ['🥇','🥈','🥉'];
  return '<div class="lbList">' + list.map((e, i) => `<div class="lbRow${e.uid === myUid ? ' lbRowMe' : ''}">
      <div class="lbRowTop"><span class="lbRank">${medals[i] || (i + 1)}</span><span class="lbName">${esc(e.name || '???')}</span><span class="lbScore">${Number(e.score) || 0}</span></div>
      <div class="lbRowMeta">🎯 ${Number(e.acc) || 0}% · ❌ ${Number(e.errors) || 0} · ⏱ ${fmtMMSS(e.secs)}</div>
    </div>`).join('') + '</div>';
}
async function lbAfterGame(level, r, gid){
  const area = $('lbArea');
  if(!area) return;
  area.innerHTML = `<p class="lbStatus">${L('loading')}</p>`;
  const lb = await waitLB();
  const stillHere = () => gid === state.gameId && $('lbArea') === area;
  if(!lb){ if(stillHere()) area.innerHTML = `<p class="lbStatus">${L('lbError')}</p>`; return; }
  try{
    const res = await lb.submitBest(level, {
      name: state.playerName, score: r.score, think: Math.round(r.thinkSec * 10) / 10, secs: r.sec,
      errors: r.errors, presses: r.totalPresses, acc: Math.round(r.accuracy * 100), replays: r.replays
    });
    const top = await lb.top(level);
    if(!stillHere()) return;
    area.innerHTML = `<p class="lbStatus"><b>${L(res.saved ? 'lbNew' : 'lbNotBetter')}</b></p>` + lbTable(top.list, top.uid);
  }catch(e){
    console.error(e);
    if(stillHere()) area.innerHTML = `<p class="lbStatus">${L('lbError')}</p>`;
  }
}
let lbModalLevel = 'level2';
async function renderLbModal(){
  const tabs = $('lbTabs'), body = $('lbBody');
  tabs.innerHTML = ['level2','level3','level4'].map(lv =>
    `<button type="button" class="opt ${lv === lbModalLevel ? 'on' : ''}" data-lv="${lv}">${L('level' + levelNum(lv))}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { lbModalLevel = b.dataset.lv; renderLbModal(); }));
  body.innerHTML = `<p class="lbStatus">${L('loading')}</p>`;
  const want = lbModalLevel;
  const lb = await waitLB();
  if(want !== lbModalLevel) return;
  if(!lb){ body.innerHTML = `<p class="lbStatus">${L('lbError')}</p>`; return; }
  try{
    const top = await lb.top(want);
    if(want !== lbModalLevel) return;
    body.innerHTML = `<p class="lbNote">${L('lbNote')}</p>` + lbTable(top.list, top.uid);
  }catch(e){ console.error(e); body.innerHTML = `<p class="lbStatus">${L('lbError')}</p>`; }
}
$('gateLbBtn').addEventListener('click', () => {
  lbModalLevel = state.selectedLevel && state.selectedLevel !== 'level1' ? state.selectedLevel : 'level2';
  $('leaderboardModal').style.display = 'flex';
  renderLbModal();

});
$('lbBackBtn').addEventListener('click', () => { $('leaderboardModal').style.display = 'none'; });

<script type="module">
// 排行榜：Firebase 專案 memorma-24dab（匿名登入；2026-10-21 由 perrito-busca-el-tesoro 併進來）
// 資料放在 perrito_boards/{level2|level3|level4}/entries/{匿名登入的 uid}，一台裝置一關一筆，只留最高分。
// 安全規則在 Memorama repo 的 firestore-rules-full.txt（整份貼到 memorma 的 Firebase 後台）。
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,query,orderBy,limit,getDocs,getDoc,doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60",
  authDomain: "memorma-24dab.firebaseapp.com",
  projectId: "memorma-24dab",
  storageBucket: "memorma-24dab.firebasestorage.app",
  messagingSenderId: "806709458465",
  appId: "1:806709458465:web:f0d12acb2f911f2f165560",
  measurementId: "G-RS1DJ7DH50"
};
try{
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  async function ensureUid(){
    await auth.authStateReady();
    if(auth.currentUser) return auth.currentUser.uid;
    const c = await signInAnonymously(auth);
    return c.user.uid;
  }
  const BOARDS = ['level2','level3','level4'];
  // 排名用的數字：分數高的在前；同分時「思考時間」短的在前
  const rankOf = e => e.score * 100000 + (99999 - Math.min(99999, Math.round(e.think * 10)));
  window.LB = {
    async top(level){
      const uid = await ensureUid();
      const snap = await getDocs(query(collection(db, 'perrito_boards', level, 'entries'), orderBy('rank', 'desc'), limit(10)));
      return { uid, list: snap.docs.map(d => ({ uid: d.id, ...d.data() })) };
    },
    async submitBest(level, e){
      if(!BOARDS.includes(level)) return { saved:false };
      const uid = await ensureUid();
      const ref = doc(db, 'perrito_boards', level, 'entries', uid);
      const rank = rankOf(e);
      const old = await getDoc(ref);
      if(old.exists() && (Number(old.data().rank) || 0) >= rank) return { saved:false };
      await setDoc(ref, {
        name: [...String(e.name || '???')].slice(0, 12).join(''),
        score: e.score, think: e.think, secs: e.secs, errors: e.errors, presses: e.presses,
        acc: e.acc, replays: e.replays, rank, updatedAt: serverTimestamp()
      });
      return { saved:true };
    }
  };
}catch(e){ console.error('Firebase 初始化失敗', e); }

<script>
/* ===== 遊玩紀錄（hgPlays）— 每個遊戲共用，貼在 </body> 前 =====
   用法：
     HGPlays.visit();                       // 頁面打開時（本檔會自動呼叫一次）
     HGPlays.start('easy', '小明');         // 真的開始玩一局（關卡／難度、暱稱都可省略）
     HGPlays.end({score: 120, name: '小明'}); // 這一局正常結算（score、name 可省略）
   沒呼叫 end 的那一局，後台就會顯示「沒玩完」。
   寫到 memorma 專案：plays（每局）、visits（每台裝置每天每遊戲一筆）。
   任何錯誤都靜默，不影響遊戲。 */
(function () {
  var GAME = 'perrito';          // ← 每個遊戲改成自己的代號（英文小寫、底線）
  var NAME_GETTER = null;                // ← 可選：function(){ return 目前暱稱或'' }
  var CFG = { apiKey: 'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60', authDomain: 'memorma-24dab.firebaseapp.com',
              projectId: 'memorma-24dab', appId: '1:806709458465:web:f0d12acb2f911f2f165560' };
  var V = '10.12.2', CDN = 'https://www.gstatic.com/firebasejs/' + V + '/';
  var cur = null, readyP = null, lib = null;

  function gid() { try { return (HG.gameFn ? HG.gameFn() : GAME) || GAME; } catch (e) { return GAME; } } // taiwan-life 這類共用引擎的遊戲可改寫 HGPlays.gameFn
  function day() { // 以台灣時間（UTC+8）算「哪一天」，方便老師對帳
    var d = new Date(Date.now() + 8 * 3600e3);
    return d.toISOString().slice(0, 10);
  }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function ready() {
    if (readyP) return readyP;
    readyP = (async function () {
      var A = await import(CDN + 'firebase-app.js');
      var Au = await import(CDN + 'firebase-auth.js');
      var F = await import(CDN + 'firebase-firestore.js');
      var app = A.initializeApp(CFG, 'hgplays');
      var auth = Au.getAuth(app);
      if (!auth.currentUser) await Au.signInAnonymously(auth);
      else await auth.authStateReady();
      lib = { F: F, db: F.getFirestore(app), uid: auth.currentUser.uid };
      return lib;
    })().catch(function () { readyP = null; return null; });
    return readyP;
  }
  function getName(n) {
    if (n) return String(n).slice(0, 36);
    try { if (NAME_GETTER) return String(NAME_GETTER() || '').slice(0, 36); } catch (e) {}
    return '';
  }

  var HG = window.HGPlays = {
    /* 每台裝置每天、每個遊戲只算一次訪客 */
    visit: function () {
      var g = gid(), d = day(), key = 'hg.visit.' + g;
      if (ls(key) === d) return;
      ready().then(function (L) {
        if (!L) return;
        var id = d + '_' + g + '_' + L.uid;
        return L.F.setDoc(L.F.doc(L.db, 'visits', id), { game: g, day: d, uid: L.uid, at: L.F.serverTimestamp() })
          .then(function () { ls(key, d); });
      }).catch(function () {});
    },
    /* 真的開始玩一局 */
    start: function (level, name) {
      var mine = cur = { id: null, level: level == null ? '' : String(level).slice(0, 30) };
      ready().then(function (L) {
        if (!L) return;
        var data = { game: gid(), level: mine.level, uid: L.uid, name: getName(name), day: day(),
                     startedAt: L.F.serverTimestamp(), done: false };
        return L.F.addDoc(L.F.collection(L.db, 'plays'), data).then(function (ref) {
          mine.id = ref.id; if (mine.pendingEnd) HG._finish(mine, mine.pendingEnd);
        });
      }).catch(function () {});
    },
    /* 這一局正常結算 */
    end: function (info) {
      var mine = cur; if (!mine || mine.ended) return; mine.ended = true; info = info || {};
      if (mine.id) HG._finish(mine, info); else mine.pendingEnd = info; // 開始的寫入還沒回來就先記著
    },
    _finish: function (mine, info) {
      ready().then(function (L) {
        if (!L || !mine.id) return;
        var u = { done: true, endedAt: L.F.serverTimestamp(),
                  secs: Math.max(0, Math.min(86400, Math.round(Number(info.secs != null ? info.secs : (Date.now() - (mine.t0 || Date.now())) / 1000) || 0))) };
        var s = Number(info.score); if (isFinite(s) && info.score != null) u.score = Math.max(-1e9, Math.min(1e9, Math.round(s)));
        var n = getName(info.name); if (n) u.name = n;
        return L.F.updateDoc(L.F.doc(L.db, 'plays', mine.id), u);
      }).catch(function () {});
    }
  };
  var _s = HG.start; HG.start = function (l, n) { _s(l, n); if (cur) cur.t0 = Date.now(); };
  setTimeout(function () { HG.visit(); }, 2500);   // 等遊戲載完再記訪客
})();
</script>
