<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Perrito Busca el Tesoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M9GNL79T0G"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-M9GNL79T0G');
</script>
<style>
  :root{
    --sky:#8FD8F8;
    --sky-light:#D9F3FF;
    --card:#FFFFFF;
    --ink:#26262B;
    --primary:#FF6B4A;
    --primary-dark:#E8532F;
    --secondary:#FFD23F;
    --secondary-dark:#E8A317;
    --teal:#2EC4B6;
    --teal-dark:#1FA294;
    --outline:#26262B;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0;
    font-family:"Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-weight:600;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,.5), transparent 40%),
      linear-gradient(180deg, var(--sky) 0%, var(--sky-light) 100%);
    color:var(--ink);
    padding:14px;
    overflow:hidden; /* 主畫面與說明欄同高後，整頁不需要捲動 */
  }
  #gameArea{
    display:flex;
    flex-wrap:nowrap;
    align-items:stretch;   /* 讓棋盤與右側說明欄自動同高 */
    justify-content:center;
    gap:14px;
    max-width:100%;
    height:100%;           /* 撐滿扣除 body padding 後的可視高度 */
  }
  h1{
    font-family:"Fredoka","Baloo 2","Noto Sans TC",sans-serif;
    font-weight:700;
    font-size:19px;
    color:#fff;
    letter-spacing:.3px;
    margin:0 0 6px 0;
    text-align:center;
    text-shadow:0 2px 0 rgba(0,0,0,.4);
    line-height:1.25;
  }
  #boardWrap{
    background:var(--outline);
    padding:10px;
    border-radius:14px;
    border:3px solid var(--outline);
    box-shadow:5px 5px 0 rgba(0,0,0,.25);
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  canvas{
    display:block;
    background:#fff;
    border-radius:6px;
  }
  #panel{
    width:280px;
    flex-shrink:0;
    background:var(--card);
    border:3px solid var(--outline);
    border-radius:16px;
    padding:12px;
    box-shadow:5px 5px 0 rgba(0,0,0,.2);
    display:flex;
    flex-direction:column;
    overflow-y:auto;       /* 極端情況下的保險，正常狀況下不會出現捲軸 */
    min-height:0;
  }

  /* ---------- 手機版：改為上下堆疊，並允許整頁上下捲動 ---------- */
  
  .seal{
    display:inline-block;
    width:100%;
    text-align: center;
    background:var(--teal);
    color:#fff;
    padding:4px 8px;
    border-radius:20px;
    border:2px solid var(--outline);
    font-size:12px;
    font-weight:700;
    letter-spacing:.2px;
    line-height:1.3;
  }
  #instructionBox{
    background:#FFD23F;
    border:3px solid #26262B;
    border-radius:12px;
    padding:8px;
    min-height:44px;
    font-size:15px;
    font-weight:700;
    text-align:center;
    color:#26262B;
    margin:8px 0 6px;
    box-shadow:3px 3px 0 rgba(0,0,0,.18);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  #instructionBox .zh-simp{
    font-size:1em;
    font-weight:700;
    color:var(--ink);
    opacity:1;
  }
  #instructionBox .zh-pair-inline{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
  }
  #instructionBox .zh-simp-inline{
    font-size:1em;
    font-weight:700;
    color:var(--ink);
    opacity:1;
  }
  #instructionBox .zh-simp-inline::before{
    content:"/ ";
    opacity:1;
  }
  #statRow{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin:6px 0;
  }
  #statRow div{
    background:#fff;
    border:2px solid var(--outline);
    border-radius:10px;
    padding:4px 8px;
    flex:1;
    margin:0 3px;
    text-align:center;
    box-shadow:2px 2px 0 rgba(0,0,0,.15);
  }
  #statRow span{
    display:block;
    font-size:18px;
    font-weight:700;
    color:var(--primary-dark);
  }
  #currentLevelBadge{
    margin-bottom:6px;
    background:#fff;
    border:2px solid var(--outline);
    border-radius:12px;
    padding:5px 8px;
    font-size:12px;
    text-align:center;
    box-shadow:2px 2px 0 rgba(0,0,0,.15);
  }
  #currentLevelBadge b{
    color:var(--primary-dark);
    display:block;
    font-size:13px;
    margin-bottom:2px;
  }
  #currentLevelBadge a{
    color:var(--teal-dark);
    font-size:11px;
    text-decoration:underline;
    font-weight:700;
    cursor:pointer;
  }
  #stageLabel{
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--primary-dark);
    min-height:14px;
    margin-bottom:2px;
  }
  button{
    width:100%;
    padding:8px;
    margin-top:6px;
    background:var(--primary);
    color:#fff;
    border:2.5px solid var(--outline);
    border-radius:999px;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    letter-spacing:.5px;
    box-shadow:3px 3px 0 rgba(0,0,0,.35);
    transform:translate(0,0);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover{ filter:brightness(1.05); }
  button:active{
    transform:translate(2px,2px);
    box-shadow:1px 1px 0 rgba(0,0,0,.35);
  }
  #errorMsg{
    color:#c0392b;
    text-align:center;
    font-weight:bold;
    min-height:15px;
    margin-top:3px;
    font-size:12px;
  }
  /* ---------- 結算彈窗 ---------- */
  #resultModal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,210,63,.18), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(232,83,47,.22), transparent 50%),
      var(--ink);
  }
  #resultCard{
    position:relative;
    width:100%;
    max-width:420px;
    text-align:center;
    background:var(--card);
    border:3px solid var(--outline);
    border-radius:20px;
    padding:30px 26px 26px;
    box-shadow:8px 8px 0 rgba(0,0,0,.3);
  }
  #resultSeal{ font-size:44px; margin-bottom:4px; }
  #resultCard h2{
    color:var(--primary-dark);
    font-size:22px;
    margin:0 0 10px;
  }
  #resultBtnRow{ margin-top:14px; }
  #nextLevelBtn{ background:var(--teal); }
  #keysHint{
    font-size:10px;
    color:#5b5b63;
    font-weight:600;
    text-align:center;
    margin-top:6px;
    line-height:1.3;
  }
  #dpad{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:8px;
    margin-bottom:2px;
    user-select:none;
  }
  #dpadCenterCol{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  #dpad button{
    margin:0;
    width:42px;
    height:42px;
    font-size:16px;
    border-radius:999px;
    background:var(--teal);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    touch-action:manipulation;
  }

  /* ---------- 玩家姓名輸入頁（進場畫面） ---------- */
  body.gate-open{ overflow:hidden; }
  body.gate-open #gameArea{ display:none; }

  #nameGate{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,210,63,.18), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(232,83,47,.22), transparent 50%),
      var(--ink);
  }
  #nameCard{
    position:relative;
    width:100%;
    max-width:380px;
    background:var(--card);
    border:3px solid var(--outline);
    border-radius:20px;
    padding:28px 26px 24px;
    text-align:center;
    box-shadow:7px 7px 0 rgba(0,0,0,.3);
    overflow:visible;
  }
  #nameCard::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid var(--secondary);
    border-radius:8px;
    pointer-events:none;
  }
  #nameSeal{
    position:absolute;
    top:-18px;
    left:-18px;
    width:64px;
    height:64px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    transform:rotate(-12deg);
    border:3px solid var(--outline);
  }
  #nameGateIcons{
    font-size:30px;
    letter-spacing:10px;
    margin:4px 0 10px;
  }
  #nameCard h1{
    font-size:19px;
    margin:0 0 4px;
    padding-left:0;
    letter-spacing:.5px;
    color:var(--primary-dark);
    text-shadow:none;
  }
  #nameCard .seal{
    margin:8px 0 16px;
  }
  #namePrompt{
    font-size:15px;
    font-weight:bold;
    color:var(--ink);
    margin:0 0 4px;
  }
  #namePromptSimp{
    font-size:13px;
    color:var(--primary-dark);
    opacity:.85;
    margin:0 0 14px;
  }
  #playerNameInput{
    width:100%;
    padding:12px 14px;
    font-size:16px;
    font-family:inherit;
    font-weight:600;
    border:2.5px solid var(--outline);
    border-radius:12px;
    background:#fff;
    color:var(--ink);
    text-align:center;
    outline:none;
  }
  #playerNameInput:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(255,107,74,.25);
  }
  #nameGateError{
    color:#c0392b;
    font-weight:bold;
    font-size:13px;
    min-height:18px;
    margin-top:6px;
  }
  #nameGateBtn{
    margin-top:14px;
  }
  #gateDifficultyRow{
    margin:16px 0 4px;
    text-align:left;
  }
  #gateDifficultyLabel{
    font-size:13px;
    font-weight:bold;
    color:var(--primary-dark);
    margin:0 0 8px;
    text-align:center;
  }
  #gateDifficultyButtons{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .gateDiffBtn{
    width:100%;
    margin:0;
    padding:8px 12px;
    background:#fff;
    color:var(--ink);
    border:2.5px solid var(--outline);
    border-radius:26px;
    padding:8px 18px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    letter-spacing:normal;
    box-shadow:2px 2px 0 rgba(0,0,0,.18);
  }
  .gateDiffBtn .diffName{
    display:block;
    font-weight:bold;
    color:var(--primary-dark);
    font-size:14px;
  }
  .gateDiffBtn .diffDesc{
    display:block;
    font-size:11px;
    color:#7a7268;
    font-weight:normal;
    margin-top:2px;
  }
  .gateDiffBtn.selected{
    background:var(--primary);
    border-color:var(--outline);
    transform:translate(2px,2px);
    box-shadow:0 0 0 rgba(0,0,0,.18);
  }
  .gateDiffBtn.selected .diffName{ color:#fff; }
  .gateDiffBtn.selected .diffDesc{ color:#fff; opacity:.9; }
  .gateDiffBtn:hover{ filter:brightness(1.03); }
  #nameGateFooter{
    margin-top:14px;
    font-size:12px;
    color:#7a7268;
  }
  #playerGreeting{
    font-size:14px;
    font-weight:bold;
    color:var(--primary-dark);
    text-align:center;
    margin:6px 0 2px;
    min-height:0;
  }
  #playerGreeting:empty{
    margin:0;
    min-height:0;
  }
  #playerGreeting span{
    display:inline-block;
    background:#fff;
    border:1px solid var(--secondary);
    border-radius:20px;
    padding:2px 10px;
  }

  /* ---------- 分數列 / 排行榜按鈕 / 練習提示 ---------- */
  #scoreLine{
    font-size:14px;
    font-weight:bold;
    color:var(--primary-dark);
    background:#fff;
    border:2px dashed var(--secondary-dark);
    border-radius:10px;
    padding:5px;
    margin-top:5px;
  }
  #viewLeaderboardBtn{
    background:var(--secondary);
    color:var(--ink);
  }
  #practiceHint{
    font-size:11px;
    color:#7a7268;
    font-style:italic;
    margin-top:5px;
    line-height:1.3;
  }

  /* ---------- 排行榜彈窗 ---------- */
  #leaderboardModal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,210,63,.18), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(232,83,47,.22), transparent 50%),
      var(--ink);
  }
  #leaderboardCard{
    position:relative;
    width:100%;
    max-width:560px;        /* 原本 420px，卡片整體加寬 */
    max-height:90vh;        /* 原本 86vh，多留一點高度 */
    display:flex;
    flex-direction:column;
    background:var(--card);
    border:3px solid var(--outline);
    border-radius:20px;
    padding:34px 30px 28px; /* 原本 26px 22px 22px，內距加大 */
    text-align:center;
    box-shadow:8px 8px 0 rgba(0,0,0,.3);
  }
  #leaderboardCloseBtn{
    position:absolute;
    top:12px;
    right:12px;
    width:36px;             /* 原本 30px */
    height:36px;
    padding:0;
    margin:0;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    font-size:16px;         /* 原本 14px */
    line-height:1;
  }
  #lbSeal{
    font-size:44px;         /* 原本 32px */
    margin-bottom:4px;
  }
  #leaderboardCard h2{
    color:var(--primary-dark);
    font-size:26px;         /* 原本 19px */
    margin:0 0 4px;
  }
  #lbSubtitle{
    font-size:16px;         /* 原本 13px */
    color:var(--primary-dark);
    opacity:.8;
    font-weight:bold;
    margin-bottom:18px;
  }
  #lbList{
    overflow-y:auto;
    text-align:left;
    border:2.5px solid var(--outline);
    border-radius:12px;
    background:#fff;
  }
  .lbRow{
    padding:12px 16px;      /* 原本 8px 12px，每列更高、更好點 */
    border-bottom:2px solid #EAF5FB;
  }
  .lbRow:last-child{ border-bottom:none; }
  .lbRowTop{
    display:grid;
    grid-template-columns:36px 1fr 72px; /* 原本 28px 1fr 56px */
    align-items:center;
    gap:10px;
    font-size:18px;         /* 原本 14px */
  }
  .lbRank{ font-weight:bold; color:var(--primary-dark); text-align:center; font-size:20px; }
  .lbName{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:var(--ink);
  }
  .lbScore{ font-weight:bold; color:var(--primary-dark); text-align:right; font-size:19px; }
  .lbRowMeta{
    margin-top:5px;
    padding-left:46px;      /* 對齊名字欄位，原本 36px */
    font-size:13px;         /* 原本 11px */
    color:#8a8072;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lbRowMe{ background:rgba(255,210,63,.22); }
  #lbStatus{
    font-size:15px;         /* 原本 13px */
    color:#7a7268;
    padding:14px 4px 4px;
    min-height:20px;
  }
  #lbBackBtn{
    margin-top:18px;
    font-size:16px;
    padding:12px 20px;      /* 按鈕也稍微放大 */
  }

  @media (max-width: 700px){
    body{
      height:auto;
      min-height:100vh;
      overflow-x:hidden;
      overflow-y:auto;
      /* 底部手勢列安全區域，避免方向鍵/開始鍵貼著螢幕邊緣 */
      padding-bottom:calc(14px + env(safe-area-inset-bottom));
    }
    #gameArea{
      flex-direction:column;
      align-items:stretch;   /* 讓每個區塊撐滿寬度，取代原本 #panel 提供的寬度 */
      height:auto;
      max-width:420px;
      margin:0 auto;
      gap:0;
    }
    /* #panel 跟 #boardWrap 都改成 display:contents，讓它們裡面的元件
       「解散框架」，變成同一層的 flex 項目，才能用 order 自由排列 */
    #panel{
      display:contents;
    }
    #boardWrap{
      display:contents;
    }

    /* 由上至下：標題/打招呼 → 時間錯誤 → 指令區塊 → 棋盤 →
       方向鍵 → 等級顯示 → 開始遊戲鍵 */
    #boardWrap > h1{
      order:10;
      margin-bottom:4px;
      color:var(--primary-dark);
      text-shadow:none;
    }
    #boardWrap > .seal{ order:20; margin-bottom:6px; }
    #panel > #playerGreeting{ order:30; }

    #panel > #statRow{ order:40; margin:6px 0; }

    #panel > #stageLabel{ order:50; }
    #panel > #instructionBox{ order:60; }
    #panel > #errorMsg{ order:70; }

    #boardWrap > canvas{
      order:80;
      align-self:center;    /* canvas 有內建尺寸，stretch 對它不生效，改用置中 */
      margin:8px 0;
      background:#000;      /* #boardWrap 解散後，黑色相框改由 canvas 自己承擔 */
      padding:10px;
      border:3px solid var(--outline);
      border-radius:14px;
      box-shadow:5px 5px 0 rgba(0,0,0,.25);
      box-sizing:content-box;
    }

    #panel > #dpad{ order:90; margin:6px 0 10px; }

    #panel > #currentLevelBadge{ order:100; margin-bottom:8px; }


    #panel > #keysHint{ display:none; }  /* 方向鍵就在棋盤下方，手機上不需要文字提示 */

    /* 方向鍵在手機上改扁一點：變寬變矮，減少版面高度 */
    #dpad{
      gap:8px;
    }
    #dpadCenterCol{
      gap:5px;
    }
    #dpad button{
      width:66px;
      height:48px;         /* 原本 38px，低於建議的最小可觸控尺寸，容易點錯/點不到 */
      border-radius:999px;
      box-shadow:none;
      font-size:17px;
    }

    /* 遊戲進行中收合非必要資訊，讓棋盤＋方向鍵能一起留在畫面內 */
    body.mobile-playing #boardWrap > h1,
    body.mobile-playing #boardWrap > .seal,
    body.mobile-playing #panel > #playerGreeting,
    body.mobile-playing #panel > #currentLevelBadge{
      display:none;
    }
    body.mobile-playing #panel > #statRow{ margin:0 0 6px; }
    body.mobile-playing #boardWrap > canvas{ margin:4px 0; }

    /* 結算/排行榜彈窗在遊戲進行中要疊在畫面上面，維持 fixed；
       手機上有些瀏覽器（LINE 內建瀏覽器、Chrome 等）自己的工具列是固定貼在
       畫面底部的，並不會被 100vh/100svh 這類視窗高度單位排除掉，算出來的高度
       會比實際看得到的範圍還高，導致最下面的按鈕被工具列蓋住、點不到。
       與其去猜工具列的高度，改成讓彈窗本身可以上下捲動、由畫面頂端開始排列，
       並在底部留一大段安全空間，不管哪種瀏覽器、工具列多高，都能捲動到看得見按鈕為止 */
    #resultModal, #leaderboardModal{
      align-items:flex-start;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding-top:max(16px, env(safe-area-inset-top));
      padding-bottom:calc(90px + env(safe-area-inset-bottom));
      min-height:100vh;
      min-height:100svh;
    }

    /* 姓名/選難度畫面是進遊戲前的第一個畫面，這時候遊戲本體本來就是隱藏的，
       不需要疊在畫面「上面」。改成一般文件流裡的區塊，直接交給瀏覽器原生的
       頁面捲動處理，徹底避開 fixed 疊層 + 動態工具列這整類不穩定的行為 */
    #nameGate{
      position:static;
      inset:auto;
      min-height:100vh;
      min-height:100svh;

function esc(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// ===== 三款遊戲共用的基本設定（⚙️）：localStorage 'hanziGames.settings'，格式見 corre/README.md =====
//   { v:1, script:'trad'|'simp', lang:'es'|'en'|'zh', phon:'pinyin'|'zhuyin'|'both'|'off', rate:'slow'|'normal'|'fast' }
//   「慢／正常／快」實際的語速每款遊戲各自決定，小狗找寶藏給外國學生聽指令，設得比色數慢。
//   ★ 想調語速或句子間的停頓，只要改下面這兩行的數字。
const RATE_VALUE = { slow:0.45, normal:0.65, fast:0.85 };   // Web Speech 的 rate，1 = 系統正常速度
const CHUNK_GAP  = { slow:1000, normal:600,  fast:350  };   // 第 4 關連續指令：句子和句子之間停幾毫秒
const SETTINGS_KEY = 'hanziGames.settings';
const SET_OPTS = { script:['trad','simp'], lang:['es','en','zh'], phon:['pinyin','zhuyin','both','off'], rate:['slow','normal','fast'] };
function readSettings(){
  const out = { v:1, script:'trad', lang:'es', phon:'pinyin', rate:'normal' };
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); }catch(e){}
  if(saved && typeof saved === 'object'){
    Object.keys(SET_OPTS).forEach(k => { if(SET_OPTS[k].includes(saved[k])) out[k] = saved[k]; });
  }else{
    writeSettings(out);
  }
  return out;
}
function writeSettings(o){
  try{
    let cur = {};
    try{ cur = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; }catch(e){}
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.assign(cur, { v:1, script:o.script, lang:o.lang, phon:o.phon, rate:o.rate })));
  }catch(e){}
}

// ===== 指令用到的字：繁體 → [簡體, 台灣讀音拼音] =====
const CH = {
  '前':['前','qián'],'進':['进','jìn'],'後':['后','hòu'],'退':['退','tuì'],'向':['向','xiàng'],'左':['左','zuǒ'],'右':['右','yòu'],'轉':['转','zhuǎn'],'格':['格','gé'],
  '一':['一','yī'],'兩':['两','liǎng'],'二':['二','èr'],'三':['三','sān'],'四':['四','sì'],'五':['五','wǔ'],'六':['六','liù'],'七':['七','qī'],'八':['八','bā'],'九':['九','jiǔ'],'十':['十','shí'],
  '找':['找','zhǎo'],'到':['到','dào'],'鑰':['钥','yào'],'匙':['匙','shi'],'了':['了','le'],'往':['往','wǎng'],'寶':['宝','bǎo'],'藏':['藏','zàng'],
  '！':['！',''],'，':['，','']
};
// 中文數字（口語計數用「兩」而非「二」）
const NUM_T = ['','一','兩','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九'];
// 一串繁體字 → 每個字 {t:繁, s:簡, p:拼音}
function toks(trad){ return [...trad].map(c => ({ t:c, s:CH[c] ? CH[c][0] : c, p:CH[c] ? CH[c][1] : '' })); }
const COMMA = { t:'，', s:'，', p:'' };
function moveToks(kind, steps){
  const tk = toks((kind === 'backward' ? '後退' : '前進') + (NUM_T[steps] || String(steps)) + '格');
  if(steps === 1) tk[2].p = 'yì';   // 一格：「一」變調唸 yì
  return tk;
}
function turnToks(kind){ return toks({ turnLeft:'向左轉', turnRight:'向右轉', turnAround:'向後轉' }[kind]); }
const KEY_TK = toks('找到鑰匙了！前往寶藏');
const TREASURE_TK = toks('找到寶藏了！');
const tradOf = tk => tk.map(x => x.t).join('');

/* 拼音（帶聲調符號）→ 注音（與跑吧！漢字、色數消消樂同一份轉換器） */
const ZY=(function(){
  var INI={b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
  var FIN={a:'ㄚ',o:'ㄛ',e:'ㄜ',ê:'ㄝ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',
    i:'ㄧ',ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',
    u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ong:'ㄨㄥ',ueng:'ㄨㄥ',
    v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ',iong:'ㄩㄥ'};
  var MARK=['','','ˊ','ˇ','ˋ'];
  function one(syl){
    var s=syl.normalize('NFD'),tone=5;
    if(/̄/.test(s))tone=1;else if(/́/.test(s))tone=2;else if(/̌/.test(s))tone=3;else if(/̀/.test(s))tone=4;
    s=s.replace(/ü/g,'v').replace(/ü/g,'v').replace(/Ü/g,'v').replace(/[̀-ͯ]/g,'').toLowerCase();
    if(!/^[a-zê]+$/.test(s))return syl;
    var ini='',rest=s,m;
    if(s==='n'||s==='m'){var zz=s==='n'?'ㄣ':'ㄇㄨ';return tone===5?'˙'+zz:zz+MARK[tone];}
    if(s==='er'||s==='r'){rest='er';}
    else if((m=s.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcs])/))){ini=m[1];rest=s.slice(ini.length);}
    else if(s[0]==='y'){rest=s.slice(1);if(/^u/.test(rest))rest=rest.replace(/^u/,'v');else if(!(rest==='i'||rest==='in'||rest==='ing'))rest='i'+rest;}
    else if(s[0]==='w'){rest=s.slice(1);rest=(rest==='u')?'u':'u'+rest;}
    if(ini&&/^[jqx]$/.test(ini))rest=rest.replace(/^u/,'v');
    if(/^(zh|ch|sh|r|z|c|s)$/.test(ini)&&rest==='i')rest='';
    var f=rest===''?'':FIN[rest];
    if(f===undefined)return syl;
    var z=(ini?INI[ini]:'')+f;
    return tone===5?'˙'+z:z+MARK[tone];
  }
  function conv(py){return String(py||'').trim().split(/\s+/).filter(Boolean).map(one).join(' ');}
  return {one:one,conv:conv};
})();

// 一串字 → HTML：每個字上面放拼音／注音（依 ⚙️；標點符號上面留空白，字才會對齊）
function zhHtml(tk){
  const ph = SETTINGS.phon;
  const top = p => {
    if(ph === 'off') return '';
    const py = p ? `<span class="ph">${esc(p)}</span>` : '<span class="ph">&nbsp;</span>';
    const zy = p ? `<span class="ph zy">${esc(ZY.one(p))}</span>` : '<span class="ph zy">&nbsp;</span>';
    return ph === 'pinyin' ? py : ph === 'zhuyin' ? zy : py + zy;
  };
  return '<span class="zhl">' + tk.map(x => `<span class="ru">${top(x.p)}<span class="hz">${esc(simp() ? x.s : x.t)}</span></span>`).join('') + '</span>';
}

let state = {
  dogRow:0, dogCol:0, facing:'down',
  treasureRow:0, treasureCol:0, treasureFound:false,
  obstacles:new Set(),
  difficulty:'level1', requiresKey:false, textHidden:false, chunked:false,
  keyRow:null, keyCol:null, keyFound:false, stage:'treasure',
  instructions: [], chunkStarts:new Set(), chunkLabels:new Map(),
  curIndex:0, stepsDone:0, snapIndex:0,
  snapshot:null,
  errorCount:0, totalPresses:0, replays:0, sameErr:0,

function sameCell(a,b){ return a.row===b.row && a.col===b.col; }
function randCell(){ return { row: Math.floor(Math.random()*GRID), col: Math.floor(Math.random()*GRID) }; }
function turnKind(oldF, newF){
  const oi = DIRS.indexOf(oldF), ni = DIRS.indexOf(newF);
  return ( (oi+1)%4 === ni ) ? 'turnRight' : 'turnLeft';
}
function cellKey(row,col){ return row+','+col; }

function tryObstacles(excluded, count){
  const obstacles = new Set();
  let guard = 0;
  while(obstacles.size < count && guard < 800){
    guard++;
    const r = Math.floor(Math.random()*GRID);
    const c = Math.floor(Math.random()*GRID);
    const key = cellKey(r,c);
    if(excluded.has(key) || obstacles.has(key)) continue;
    obstacles.add(key);
  }
  return obstacles;
}

function bfsPath(startRow,startCol,targetRow,targetCol,obstacles){
  const startKey = cellKey(startRow,startCol);
  const targetKey = cellKey(targetRow,targetCol);
  if(startKey === targetKey) return [];
  const visited = new Set([startKey]);
  const prev = new Map();
  const queue = [{row:startRow,col:startCol}];
  let qi = 0;
  while(qi < queue.length){
    const cur = queue[qi++];
    const curKey = cellKey(cur.row,cur.col);
    if(curKey === targetKey){
      let path = [];
      let key = curKey;
      while(key !== startKey){
        const [pr,pc,dir] = prev.get(key);
        path.unshift(dir);
        key = cellKey(pr,pc);
      }
      return path;
    }
    for(const dir of DIRS){
      const d = DELTA[dir];
      const nr = cur.row + d.dr, nc = cur.col + d.dc;
      if(nr<0||nr>=GRID||nc<0||nc>=GRID) continue;
      const nk = cellKey(nr,nc);
      if(visited.has(nk) || obstacles.has(nk)) continue;
      visited.add(nk);
      prev.set(nk, [cur.row, cur.col, dir]);
      queue.push({row:nr, col:nc});
    }
  }
  return null;
}

function compressRuns(dirArray){
  const runs = [];
  for(const d of dirArray){
    if(runs.length && runs[runs.length-1].dir === d) runs[runs.length-1].steps++;
    else runs.push({dir:d, steps:1});
  }
  return runs;
}

function buildInstructionsFromRuns(runs, startFacing){
  let instructions = [];
  let facing = startFacing;
  for(const run of runs){
    const { dir, steps } = run;
    if(dir !== facing && dir !== OPPOSITE[facing]){
      instructions.push({ kind:'turn', dir, tk: turnToks(turnKind(facing, dir)) });
      facing = dir;
    }
    if(dir === OPPOSITE[facing]){
      if(Math.random() < 0.5){
        instructions.push({ kind:'move', dir, steps, tk: moveToks('backward', steps) });
      } else {
        instructions.push({ kind:'turn', dir, tk: turnToks('turnAround') });
        facing = dir;
        instructions.push({ kind:'move', dir, steps, tk: moveToks('forward', steps) });
      }
    } else {
      instructions.push({ kind:'move', dir, steps, tk: moveToks('forward', steps) });
    }
  }
  return instructions;
}

// 把指令分組：第 4 關每 2～3 句一組連續唸；其他關一句一組
function chunkInstructions(list, chunked){
  const starts = new Set();
  const labels = new Map();   // 組的第一句 index → { tk:整組文字, texts:[一句一句的繁體，給語音用] }
  let i = 0;
  while(i < list.length){
    const size = chunked ? Math.min(2 + Math.floor(Math.random()*2), list.length - i) : 1;
    starts.add(i);
    const tk = [], texts = [];
    for(let j=i; j<i+size; j++){
      if(j > i) tk.push(COMMA);
      tk.push(...list[j].tk);
      texts.push(tradOf(list[j].tk));
    }
    labels.set(i, { tk, texts });
    i += size;
  }
  return { starts, labels };
}

function setInstructions(list){
  state.instructions = list;
  const g = chunkInstructions(list, state.chunked);
  state.chunkStarts = g.starts;
  state.chunkLabels = g.labels;
}

function planRoute(row, col, facing, targetRow, targetCol, obstacles){
  const dirPath = bfsPath(row, col, targetRow, targetCol, obstacles);
  if(!dirPath) return null;
  return buildInstructionsFromRuns(compressRuns(dirPath), facing);
}

function planGame(dogStart, treasure, key, minObs, maxObs){
  const excluded = new Set([cellKey(dogStart.row,dogStart.col), cellKey(treasure.row,treasure.col)]);
  if(key) excluded.add(cellKey(key.row,key.col));
  for(let attempt=0; attempt<40; attempt++){
    const count = minObs + Math.floor(Math.random()*(maxObs-minObs+1));
    const obstacles = tryObstacles(excluded, count);
    if(key){
      const path1 = bfsPath(dogStart.row, dogStart.col, key.row, key.col, obstacles);
      if(!path1) continue;
      const path2 = bfsPath(key.row, key.col, treasure.row, treasure.col, obstacles);
      if(!path2) continue;
      return { obstacles, firstInstructions: buildInstructionsFromRuns(compressRuns(path1), 'down') };
    } else {
      const path = bfsPath(dogStart.row, dogStart.col, treasure.row, treasure.col, obstacles);
      if(!path) continue;
      return { obstacles, firstInstructions: buildInstructionsFromRuns(compressRuns(path), 'down') };
    }
  }
  const obstacles = new Set();
  const target = key || treasure;
  const path = bfsPath(dogStart.row, dogStart.col, target.row, target.col, obstacles);
  return { obstacles, firstInstructions: buildInstructionsFromRuns(compressRuns(path), 'down') };
}

// 各關設定。語速不再每關各自設定，改用 ⚙️ 的共用語速（上面的 RATE_VALUE）。
function difficultySettings(difficulty){
  if(difficulty === 'level2') return { minObs:15, maxObs:25, requiresKey:true, textHidden:false, chunked:false };
  if(difficulty === 'level3') return { minObs:20, maxObs:30, requiresKey:true, textHidden:true,  chunked:false };
  if(difficulty === 'level4') return { minObs:20, maxObs:30, requiresKey:true, textHidden:true,  chunked:true  };
  return { minObs:7, maxObs:15, requiresKey:false, textHidden:false, chunked:false };
}
const LEVEL_ORDER = ['level1','level2','level3','level4'];
const levelNum = lv => LEVEL_ORDER.indexOf(lv) + 1;

// ===== 計時：「時間」不算暫停；「思考時間」再扣掉語音播放的時間（選慢速的學生不會吃虧） =====
function clockTick(){
  const now = Date.now();
  if(state.clockOn && !state.paused){
    state.activeMs += now - state.clockLast;
    if(!state.speaking) state.thinkMs += now - state.clockLast;
  }
  state.clockLast = now;
}
function fmtMMSS(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}
function updateTimer(){

  document.getElementById('timerDisp').textContent = fmtMMSS(state.activeMs/1000);
}

let voice = null, voiceFallback = null, speechTok = 0;
function loadVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const norm = v => v.lang.replace('_','-').toLowerCase();
  voice = vs.find(v => norm(v) === 'zh-tw') || null;
  voiceFallback = vs.find(v => norm(v).startsWith('zh')) || null;
}
let voicesSeen = false;
function refreshVoiceNote(){
  let k = '';
  if(!('speechSynthesis' in window)) k = 'novoice';
  else if(voicesSeen && !voice) k = voiceFallback ? 'fallback' : 'novoice';
  ['voiceWarnGate','voiceWarnGame'].forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.toggle('hide', !k);
    el.innerHTML = k ? L(k) : '';
  });
}
if('speechSynthesis' in window){
  loadVoice();
  speechSynthesis.onvoiceschanged = () => { loadVoice(); voicesSeen = true; refreshVoiceNote(); };
  setTimeout(() => { loadVoice(); refreshVoiceNote(); }, 800);
  setTimeout(() => { loadVoice(); voicesSeen = true; refreshVoiceNote(); }, 2500);
}
function setSpeaking(on){ clockTick(); state.speaking = on; }
// 依序唸好幾句（第 4 關連續指令用），句子之間停一下；全部唸完才呼叫 onEnd
function speakSeq(texts, onEnd){
  const my = ++speechTok;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(!('speechSynthesis' in window) || !texts.length){
    setSpeaking(false);
    if(onEnd) setTimeout(() => { if(my === speechTok) onEnd(); }, 300);
    return;
  }
  setSpeaking(true);
  let i = 0;
  const next = () => {
    if(my !== speechTok) return;
    if(i >= texts.length){ setSpeaking(false); if(onEnd) onEnd(); return; }
    let u;
    try{
      u = new SpeechSynthesisUtterance(texts[i++]);
      u.lang = 'zh-TW';
      const v = voice || voiceFallback; if(v) u.voice = v;
      u.rate = RATE_VALUE[SETTINGS.rate] || RATE_VALUE.normal;
    }catch(e){ setSpeaking(false); if(onEnd) onEnd(); return; }
    let done = false;
    const fin = () => {
      if(done) return; done = true;
      if(my !== speechTok) return;
      if(i < texts.length) setTimeout(next, CHUNK_GAP[SETTINGS.rate] || CHUNK_GAP.normal);
      else next();
    };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 12000);   // 保險：有些瀏覽器不會觸發結束事件
    try{ window.speechSynthesis.speak(u); }catch(e){ fin(); }
  };
  setTimeout(next, 60);   // cancel 後馬上 speak，有些瀏覽器會吃掉，稍等一下
}
function stopSpeech(){
  speechTok++;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  setSpeaking(false);
}

function startGame(){
  ensureAudio();
  stopSpeech();
  clearHint();
  const gid = ++state.gameId;
  const difficulty = state.difficulty || 'level1';
  const settings = difficultySettings(difficulty);

  const dogStart = randCell();
  let treasure = randCell();
  while(sameCell(treasure, dogStart)) treasure = randCell();
  let key = null;
  if(settings.requiresKey){
    key = randCell();
    while(sameCell(key, dogStart) || sameCell(key, treasure)) key = randCell();
  }
  const plan = planGame(dogStart, treasure, key, settings.minObs, settings.maxObs);

  state.difficulty = difficulty;
  state.requiresKey = settings.requiresKey;
  state.textHidden = settings.textHidden;
  state.chunked = settings.chunked;
  state.dogRow = dogStart.row;
  state.dogCol = dogStart.col;
  state.facing = 'down';
  state.treasureRow = treasure.row;
  state.treasureCol = treasure.col;
  state.treasureFound = false;
  state.keyRow = key ? key.row : null;
  state.keyCol = key ? key.col : null;
  state.keyFound = false;
  state.stage = settings.requiresKey ? 'key' : 'treasure';
  state.obstacles = plan.obstacles;
  state.errorCount = 0;
  state.totalPresses = 0;
  state.replays = 0;
  state.sameErr = 0;
  state.curIndex = 0;
  state.stepsDone = 0;
  setInstructions(plan.firstInstructions);
  state.playing = true;
  state.paused = false;
  state.awaitingKeyAnnouncement = false;
  state.keyAnnounceId = 0;
  setMobilePlayingCompact(true);

  updateCurrentLevelBadge();
  hideOverlays();
  document.getElementById('errorMsg').textContent = '';
  document.getElementById('errorDisp').textContent = '0';
  state.activeMs = 0; state.thinkMs = 0;
  state.clockLast = Date.now(); state.clockOn = true;
  if(state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(updateTimer, 500);
  updateTimer();
  updateCtlButtons();

  updateStageLabel();
  snapshotInstruction();
  showCurrentInstruction();
  draw();
  trackEvent('game_start', { level: state.difficulty });
  return gid;
}

function stopClock(){
  clockTick();
  state.clockOn = false;
  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
}

function checkGoal(){
  const gid = state.gameId;
  if(state.stage === 'key'){
    if(state.dogRow===state.keyRow && state.dogCol===state.keyCol){
      state.keyFound = true;
      draw();
      state.box = 'key';
      renderBox();
      const route = planRoute(state.dogRow, state.dogCol, state.facing, state.treasureRow, state.treasureCol, state.obstacles) || [];
      setInstructions(route);
      state.curIndex = 0;
      state.stepsDone = 0;
      state.stage = 'treasure';
      snapshotInstruction();
      updateStageLabel();
      clearHint();
      state.awaitingKeyAnnouncement = true;
      const myId = state.keyAnnounceId = Date.now() + Math.random();
      const proceed = () => {
        // 同一局、同一次宣布才繼續（避免重新開始或暫停後，舊的計時器又把指令唸出來）
        if(gid !== state.gameId || myId !== state.keyAnnounceId) return;
        state.keyAnnounceId = 0;
        state.awaitingKeyAnnouncement = false;
        if(state.paused) return;
        showCurrentInstruction();
      };
      speakSeq([tradOf(KEY_TK)], proceed);
      setTimeout(proceed, 12000);   // 保險：語音沒有正常結束時，最多等 12 秒
      trackEvent('stage_transition', { level: state.difficulty, from: 'key', to: 'treasure' });
      return true;
    }
    return false;
  }

  if(state.dogRow===state.treasureRow && state.dogCol===state.treasureCol){
    state.treasureFound = true;
    state.playing = false;
    stopClock();
    clearHint();
    setMobilePlayingCompact(false);
    updateCtlButtons();
    const result = computeScore();
    state.box = 'treasure';
    renderBox();
    draw();
    trackEvent('level_complete', {
      level: state.difficulty,
      score: result.score,
      accuracy: Math.round(result.accuracy*100),
      time_spent: result.sec,
      think_per_step: Math.round(result.avgThink*10)/10,
      error_count: result.errors,
      replays: result.replays
    });
    playTreasureCelebration('恭喜，' + tradOf(TREASURE_TK), gid, () => showResult(result));
    return true;
  }
  return false;
}

// ===== 提示（只有第 1 關）：同一組指令連續錯 3 次，該按的方向鍵會亮起來 =====
function showHint(){
  const ins = state.instructions[state.curIndex];
  if(!ins) return;
  clearHint();
  const b = document.getElementById(DPAD_ID[ins.dir]);
  if(b) b.classList.add('hintGlow');
  document.getElementById('errorMsg').innerHTML = L('hint');
}
function clearHint(){
  document.querySelectorAll('#dpad .hintGlow').forEach(b => b.classList.remove('hintGlow'));
}

// 按錯：小狗回到「這一組」的起點，整組重唸（第 4 關連續指令也是整組重來）
function handleWrongKey(){
  const gid = state.gameId;
  state.errorCount++;
  state.sameErr++;
  document.getElementById('errorDisp').textContent = state.errorCount;
  document.getElementById('errorMsg').innerHTML = L('wrong');
  clearHint();
  state.dogRow = state.snapshot.row;
  state.dogCol = state.snapshot.col;
  state.facing = state.snapshot.facing;
  state.curIndex = state.snapIndex;
  state.stepsDone = 0;
  draw();
  const errNo = state.errorCount;
  setTimeout(() => {
    if(gid !== state.gameId || !state.playing || errNo !== state.errorCount) return;
    document.getElementById('errorMsg').textContent = '';
    if(state.paused) return;
    sayCurrentChunk();
    if(state.difficulty === 'level1' && state.sameErr >= 3) showHint();
  }, 900);
  trackEvent('error_made', { level: state.difficulty, stage: state.stage });
}

function advanceInstruction(){
  state.curIndex++;
  state.stepsDone = 0;
  if(state.curIndex < state.instructions.length){
    if(state.chunkStarts.has(state.curIndex)){
      state.sameErr = 0;
      clearHint();
      document.getElementById('errorMsg').textContent = '';
      snapshotInstruction();
      showCurrentInstruction();
    }
  } else {
    if(!checkGoal()){
      const target = state.stage === 'key'
        ? { row:state.keyRow, col:state.keyCol }
        : { row:state.treasureRow, col:state.treasureCol };
      const rerouted = planRoute(state.dogRow, state.dogCol, state.facing, target.row, target.col, state.obstacles);
      setInstructions(rerouted || []);
      state.curIndex = 0;
      snapshotInstruction();
      showCurrentInstruction();
    }
  }
}

let audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function playTone(freq, duration, type, gain){
  try{
    ensureAudio();
    if(!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + duration);
  }catch(e){}
}
function playBeep(pressIndex){ playTone(900 + Math.min(pressIndex || 0, 6)*90, 0.12, 'sine', 0.22); }
function playErrorTone(){ playTone(220, 0.22, 'square', 0.18); }

function pressDirection(dir){
  if(!state.playing){ playBeep(0); return; }
  if(state.paused) return;
  if(state.awaitingKeyAnnouncement) return; // 「找到鑰匙了」的語音還沒講完，先忽略操作，避免蓋過去
  if(state.curIndex >= state.instructions.length) return;
  const ins = state.instructions[state.curIndex];
  if(dir !== ins.dir){
    playErrorTone();
    handleWrongKey();
    return;
  }
  clearHint();
  state.totalPresses++;
  if(ins.kind === 'turn'){
    playBeep(0);
    state.facing = dir;
    draw();
    advanceInstruction();
  } else {
    playBeep(state.stepsDone);
    const d = DELTA[dir];
    state.dogRow += d.dr;
    state.dogCol += d.dc;
    state.stepsDone++;
    draw();
    if(checkGoal()) return;
    if(state.stepsDone >= ins.steps) advanceInstruction();
  }
}

function handleKey(e){
  const dir = KEYMAP[e.key];
  if(!dir) return;
  if(document.body.classList.contains('gate-open')) return;
  if(!document.getElementById('setov').classList.contains('hide')) return;
  e.preventDefault();
  pressDirection(dir);
}
document.addEventListener('keydown', handleKey);

function bindDpad(id, dir){
  const el = document.getElementById(id);
  el.addEventListener('click', () => pressDirection(dir));
  el.addEventListener('touchstart', e => { e.preventDefault(); pressDirection(dir); }, {passive:false});
}
bindDpad('dpadUp','up');
bindDpad('dpadDown','down');
bindDpad('dpadLeft','left');
bindDpad('dpadRight','right');

// ---------- Drawing ----------
function draw(){
  // 卡通風格棋盤底色：淺藍/白 棋盤格交錯
  for(let r=0;r<GRID;r++){
    for(let c=0;c<GRID;c++){
      ctx.fillStyle = ((r+c)%2===0) ? '#FFFFFF' : '#E8F7FF';
      ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
    }
  }
  ctx.strokeStyle = '#2b2b2b';
  ctx.lineWidth = 1.4;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath();
    ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL, GRID*CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0,i*CELL); ctx.lineTo(GRID*CELL, i*CELL);
    ctx.stroke();
  }
  state.obstacles.forEach(key=>{
    const [r,c] = key.split(',').map(Number);
    drawObstacle(c*CELL+CELL/2, r*CELL+CELL/2);
  });
  if(state.requiresKey && state.keyFound){
    drawKey(state.keyCol*CELL+CELL/2, state.keyRow*CELL+CELL/2);
  }
  if(state.treasureFound){
    drawTreasure(state.treasureCol*CELL+CELL/2, state.treasureRow*CELL+CELL/2);
  }
  drawDog(state.dogCol*CELL+CELL/2, state.dogRow*CELL+CELL/2, state.facing);
}

function drawObstacle(cx,cy){
  ctx.save();
  ctx.translate(cx,cy);
  const s = CELL*0.86;
  const black = '#1a1208';
  const gray1 = '#B9C2CC';
  const gray2 = '#8C97A3';
  const white = '#fff';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // 主體：不規則圓角石頭
  ctx.beginPath();
  ctx.moveTo(-s*0.42, s*0.06);
  ctx.quadraticCurveTo(-s*0.46, -s*0.22, -s*0.18, -s*0.34);
  ctx.quadraticCurveTo(s*0.04, -s*0.46, s*0.30, -s*0.28);
  ctx.quadraticCurveTo(s*0.48, -s*0.14, s*0.42, s*0.10);
  ctx.quadraticCurveTo(s*0.36, s*0.34, s*0.06, s*0.38);
  ctx.quadraticCurveTo(-s*0.28, s*0.40, -s*0.42, s*0.06);
  ctx.closePath();
  ctx.fillStyle = gray1;
  ctx.fill();
  ctx.lineWidth = Math.max(2, s*0.07);
  ctx.strokeStyle = black;
  ctx.stroke();

  // 陰影面（做出立體感）
  ctx.save();
  ctx.clip();
  ctx.beginPath();
  ctx.ellipse(s*0.14, s*0.14, s*0.34, s*0.26, 0.3, 0, Math.PI*2);
  ctx.fillStyle = gray2;
  ctx.fill();
  ctx.restore();

  // 裂紋線條
  ctx.beginPath();
  ctx.moveTo(-s*0.10,-s*0.20);
  ctx.quadraticCurveTo(-s*0.02,-s*0.06, -s*0.14, s*0.08);
  ctx.lineWidth = Math.max(1.4, s*0.035);
  ctx.strokeStyle = black;
  ctx.globalAlpha = 0.55;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // 高光
  ctx.beginPath();
  ctx.ellipse(-s*0.18,-s*0.16,s*0.09,s*0.05,-0.4,0,Math.PI*2);
  ctx.fillStyle = white;
  ctx.globalAlpha = 0.85;
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawKey(cx,cy){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(-0.55);
  const s = CELL*0.8;
  const black = '#1a1208';
  const gold = '#FFD23F';
  const white = '#fff';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  const lw = Math.max(2, s*0.07);

  // 鑰匙桿
  ctx.beginPath();
  ctx.moveTo(-s*0.02, -s*0.05);
  ctx.lineTo(s*0.38, -s*0.05);
  ctx.lineTo(s*0.38, s*0.05);
  ctx.lineTo(-s*0.02, s*0.05);
  ctx.closePath();
  ctx.fillStyle = gold;
  ctx.fill();
  ctx.lineWidth = lw;
  ctx.strokeStyle = black;
  ctx.stroke();

  // 鑰匙齒
  ctx.beginPath();
  ctx.rect(s*0.24, s*0.05, s*0.06, s*0.12);
  ctx.rect(s*0.36, s*0.05, s*0.06, s*0.16);
  ctx.fillStyle = gold;
  ctx.fill();
  ctx.lineWidth = lw*0.85;
  ctx.strokeStyle = black;
  ctx.stroke();

  // 鑰匙頭（圓環）
  ctx.beginPath();
  ctx.arc(-s*0.24, 0, s*0.26, 0, Math.PI*2);
  ctx.fillStyle = gold;
  ctx.fill();
  ctx.lineWidth = lw;
  ctx.strokeStyle = black;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(-s*0.24, 0, s*0.11, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.lineWidth = lw*0.8;
  ctx.strokeStyle = black;
  ctx.stroke();

  // 高光
  ctx.beginPath();
  ctx.ellipse(-s*0.33,-s*0.10,s*0.07,s*0.035,-0.5,0,Math.PI*2);
  ctx.fillStyle = white;
  ctx.globalAlpha = 0.8;
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawTreasure(cx,cy,sizeOverride){
  ctx.save();
  ctx.translate(cx,cy);
  const s = sizeOverride || CELL*0.42;
  const black = '#1a1208';
  const gold = '#FFD23F';
  const goldDark = '#E8A317';
  ctx.lineJoin='round'; ctx.lineCap='round';
  const lw = Math.max(2.2, s*0.11);

  ctx.beginPath();
  ctx.arc(0,0,s,0,Math.PI*2);
  ctx.fillStyle = gold;
  ctx.fill();
  ctx.lineWidth = lw;
  ctx.strokeStyle = black;
  ctx.stroke();

  // 內圈做硬幣質感
  ctx.beginPath();
  ctx.arc(0,0,s*0.72,0,Math.PI*2);
  ctx.lineWidth = lw*0.5;
  ctx.strokeStyle = goldDark;
  ctx.stroke();

  ctx.fillStyle = black;
  ctx.font = 'bold '+(s*0.95)+'px "Noto Sans TC",sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('寶',0,1);

  // 高光
  ctx.beginPath();
  ctx.ellipse(-s*0.35,-s*0.35,s*0.22,s*0.12,-0.5,0,Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.55;
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawDog(cx,cy,facing){
  ctx.save();
  ctx.translate(cx,cy);
  const s = CELL*0.95;
  const black = '#1a1208';
  const brown = '#5C3A21';
  const brownDark = '#4a2e19';
  const tan = '#E8B268';
  const white = '#fff';
  const collar = '#B23A2E';
  const lw = Math.max(2, s*0.06);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  function roundRectPath(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  if(facing==='left' || facing==='right'){
    const dir = facing==='right' ? 1 : -1;
    ctx.save();
    ctx.scale(dir,1);

    // 尾巴（往上捲，像逗號）
    ctx.beginPath();
    ctx.moveTo(-s*0.38, s*0.12);
    ctx.quadraticCurveTo(-s*0.64, s*0.06, -s*0.58, -s*0.24);
    ctx.quadraticCurveTo(-s*0.55, -s*0.44, -s*0.38, -s*0.38);
    ctx.quadraticCurveTo(-s*0.46, -s*0.22, -s*0.44, -s*0.02);
    ctx.quadraticCurveTo(-s*0.42, s*0.06, -s*0.28, s*0.08);
    ctx.closePath();
    ctx.fillStyle = brown;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 四隻腳（淺棕色）
    ctx.fillStyle = tan;
    [-s*0.30, -s*0.02, s*0.16].forEach(lx=>{
      roundRectPath(lx, s*0.14, s*0.09, s*0.20, s*0.03);
      ctx.fill();
      ctx.lineWidth = lw*0.85;
      ctx.strokeStyle = black;
      ctx.stroke();
    });

    // 身體（深棕色，長橢圓）
    ctx.beginPath();
    ctx.ellipse(-s*0.02, s*0.00, s*0.46, s*0.22, 0, 0, Math.PI*2);
    ctx.fillStyle = brown;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 肚子（淺棕色貼片）
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(-s*0.02, s*0.00, s*0.46, s*0.22, 0, 0, Math.PI*2);
    ctx.clip();
    ctx.beginPath();
    ctx.ellipse(-s*0.02, s*0.14, s*0.36, s*0.12, 0, 0, Math.PI*2);
    ctx.fillStyle = tan;
    ctx.fill();
    ctx.restore();

    // 耳朵（直立）
    ctx.beginPath();
    ctx.ellipse(s*0.20,-s*0.28,s*0.09,s*0.18,0.4,0,Math.PI*2);
    ctx.fillStyle = brownDark;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 頭
    ctx.beginPath();
    ctx.arc(s*0.32,-s*0.06,s*0.23,0,Math.PI*2);
    ctx.fillStyle = brown;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 口鼻（臘腸狗特色：長長的口鼻）
    ctx.beginPath();
    ctx.ellipse(s*0.60,0,s*0.20,s*0.10,0,0,Math.PI*2);
    ctx.fillStyle = tan;
    ctx.fill();
    ctx.lineWidth = lw*0.9;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 鼻子
    ctx.beginPath();
    ctx.ellipse(s*0.76,-s*0.01,s*0.055,s*0.045,0,0,Math.PI*2);
    ctx.fillStyle = black;
    ctx.fill();

    // 項圈
    ctx.fillStyle = collar;
    ctx.fillRect(s*0.12,s*0.08,s*0.16,s*0.07);

    // 眼睛
    ctx.fillStyle = white;
    ctx.beginPath(); ctx.arc(s*0.34,-s*0.13,3.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = black;
    ctx.beginPath(); ctx.arc(s*0.355,-s*0.13,1.8,0,Math.PI*2); ctx.fill();

    ctx.restore();
  } else if(facing==='down'){
    // 耳朵
    ctx.fillStyle = brownDark;
    ctx.beginPath();
    ctx.ellipse(-s*0.19,-s*0.30,s*0.09,s*0.17,-0.3,0,Math.PI*2);
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = black;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(s*0.19,-s*0.30,s*0.09,s*0.17,0.3,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // 腳
    ctx.fillStyle = tan;
    [-s*0.24, s*0.15].forEach(lx=>{
      roundRectPath(lx, s*0.24, s*0.10, s*0.14, s*0.03);
      ctx.fill();
      ctx.lineWidth = lw*0.85;
      ctx.strokeStyle = black;
      ctx.stroke();
    });

    // 身體
    ctx.beginPath();
    ctx.ellipse(0, s*0.20, s*0.30, s*0.20, 0, 0, Math.PI*2);
    ctx.fillStyle = brown;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 頭
    ctx.beginPath();
    ctx.arc(0,-s*0.06,s*0.25,0,Math.PI*2);
    ctx.fillStyle = brown;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 口鼻貼片
    ctx.beginPath();
    ctx.ellipse(0, s*0.06, s*0.14, s*0.10, 0, 0, Math.PI*2);
    ctx.fillStyle = tan;
    ctx.fill();
    ctx.lineWidth = lw*0.85;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 鼻子
    ctx.beginPath();
    ctx.ellipse(0, s*0.04, s*0.045, s*0.035, 0, 0, Math.PI*2);
    ctx.fillStyle = black;
    ctx.fill();

    // 項圈
    ctx.fillStyle = collar;
    ctx.fillRect(-s*0.16, s*0.115, s*0.32, s*0.065);

    // 眼睛
    ctx.fillStyle = white;
    ctx.beginPath(); ctx.arc(-s*0.10,-s*0.08,3.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.10,-s*0.08,3.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = black;
    ctx.beginPath(); ctx.arc(-s*0.10,-s*0.08,1.7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.10,-s*0.08,1.7,0,Math.PI*2); ctx.fill();

  } else {
    // 尾巴
    ctx.beginPath();
    ctx.moveTo(0, s*0.32);
    ctx.quadraticCurveTo(s*0.20, s*0.40, s*0.14, s*0.20);
    ctx.quadraticCurveTo(s*0.10, s*0.10, s*0.02, s*0.20);
    ctx.closePath();
    ctx.fillStyle = brown;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 腳
    ctx.fillStyle = tan;
    [-s*0.24, s*0.15].forEach(lx=>{
      roundRectPath(lx, s*0.24, s*0.10, s*0.14, s*0.03);
      ctx.fill();
      ctx.lineWidth = lw*0.85;
      ctx.strokeStyle = black;
      ctx.stroke();
    });

    // 身體
    ctx.beginPath();
    ctx.ellipse(0, s*0.14, s*0.28, s*0.22, 0, 0, Math.PI*2);
    ctx.fillStyle = brown;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 頭（背面）
    ctx.beginPath();
    ctx.arc(0, -s*0.14, s*0.23, 0, Math.PI*2);
    ctx.fillStyle = brown;
    ctx.fill();
    ctx.lineWidth = lw;
    ctx.strokeStyle = black;
    ctx.stroke();

    // 耳朵（背面看到的直立耳）
    ctx.fillStyle = brownDark;
    ctx.beginPath();
    ctx.ellipse(-s*0.15,-s*0.30,s*0.075,s*0.14,-0.15,0,Math.PI*2);
    ctx.fill();
    ctx.lineWidth = lw*0.9;
    ctx.strokeStyle = black;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(s*0.15,-s*0.30,s*0.075,s*0.14,0.15,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- 找到寶藏的慶祝動畫（吐舌頭小狗 + 寶藏 + 閃光，疊在棋盤正中央） ----------
function drawHappyDog(cx, cy, s){
  ctx.save();
  ctx.translate(cx, cy);
  const black = '#1a1208';
  const brown = '#5C3A21';
  const brownDark = '#4a2e19';
  const tan = '#E8B268';
  const white = '#fff';
  const collar = '#B23A2E';
  const tongue = '#FF6F91';
  const tongueDark = '#D94F72';
  const lw = Math.max(2, s*0.06);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  function roundRectPath(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // 耳朵（開心地往外翹）
  ctx.fillStyle = brownDark;
  ctx.beginPath();
  ctx.ellipse(-s*0.20,-s*0.32,s*0.09,s*0.17,-0.5,0,Math.PI*2);
  ctx.fill();
  ctx.lineWidth = lw;
  ctx.strokeStyle = black;
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(s*0.20,-s*0.32,s*0.09,s*0.17,0.5,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // 腳
  ctx.fillStyle = tan;
  [-s*0.24, s*0.15].forEach(lx=>{
    roundRectPath(lx, s*0.24, s*0.10, s*0.14, s*0.03);
    ctx.fill();
    ctx.lineWidth = lw*0.85;
    ctx.strokeStyle = black;
    ctx.stroke();
  });

  // 身體
  ctx.beginPath();
  ctx.ellipse(0, s*0.20, s*0.30, s*0.20, 0, 0, Math.PI*2);
  ctx.fillStyle = brown;
  ctx.fill();
  ctx.lineWidth = lw;
  ctx.strokeStyle = black;
  ctx.stroke();

  // 頭
  ctx.beginPath();
  ctx.arc(0,-s*0.06,s*0.25,0,Math.PI*2);
  ctx.fillStyle = brown;
  ctx.fill();
  ctx.lineWidth = lw;
  ctx.strokeStyle = black;
  ctx.stroke();

  // 口鼻貼片
  ctx.beginPath();
  ctx.ellipse(0, s*0.06, s*0.14, s*0.10, 0, 0, Math.PI*2);
  ctx.fillStyle = tan;
  ctx.fill();
  ctx.lineWidth = lw*0.85;
  ctx.strokeStyle = black;
  ctx.stroke();

  // 吐出來的舌頭
  ctx.beginPath();
  ctx.moveTo(-s*0.06, s*0.10);
  ctx.quadraticCurveTo(-s*0.07, s*0.26, 0, s*0.30);
  ctx.quadraticCurveTo(s*0.07, s*0.26, s*0.06, s*0.10);
  ctx.closePath();
  ctx.fillStyle = tongue;
  ctx.fill();
  ctx.lineWidth = lw*0.7;
  ctx.strokeStyle = black;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, s*0.12);
  ctx.lineTo(0, s*0.25);
  ctx.lineWidth = lw*0.4;
  ctx.strokeStyle = tongueDark;
  ctx.stroke();

  // 鼻子
  ctx.beginPath();
  ctx.ellipse(0, s*0.02, s*0.045, s*0.035, 0, 0, Math.PI*2);
  ctx.fillStyle = black;
  ctx.fill();

  // 項圈
  ctx.fillStyle = collar;
  ctx.fillRect(-s*0.16, s*0.115, s*0.32, s*0.065);

  // 開心瞇眼（往上彎的弧線）
  ctx.lineWidth = lw*0.9;
  ctx.strokeStyle = black;
  ctx.beginPath();
  ctx.arc(-s*0.10, -s*0.09, s*0.05, Math.PI*0.15, Math.PI*0.85);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(s*0.10, -s*0.09, s*0.05, Math.PI*0.15, Math.PI*0.85);
  ctx.stroke();

  ctx.restore();
}

function drawStar(cx, cy, r, rotation){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation || 0);
  ctx.beginPath();
  for(let i=0;i<4;i++){
    const a1 = (Math.PI/2)*i;
    ctx.lineTo(Math.cos(a1)*r, Math.sin(a1)*r);
    const a2 = a1 + Math.PI/4;
    ctx.lineTo(Math.cos(a2)*r*0.35, Math.sin(a2)*r*0.35);
  }
  ctx.closePath();
  ctx.fillStyle = '#FFF3B0';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#E8A317';
  ctx.stroke();
  ctx.restore();
}

function drawSparkleBurst(cx, cy, spread, alpha){
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  const positions = [
    { dx:-spread, dy:-spread*0.6, r:spread*0.22, rot:0.3 },
    { dx: spread, dy:-spread*0.75, r:spread*0.16, rot:-0.2 },
    { dx:-spread*0.85, dy: spread*0.7, r:spread*0.15, rot:0.6 },
    { dx: spread*0.9, dy: spread*0.65, r:spread*0.20, rot:-0.5 }
  ];
  positions.forEach(p => drawStar(cx+p.dx, cy+p.dy, p.r, p.rot));
  ctx.restore();
}

// 找到寶藏後，在棋盤正中央（不管寶藏實際在哪一格）快速播放幾格「閃光→小狗吐舌頭+寶藏」
// 的慶祝畫面，播完再呼叫 onDone 顯示結算彈窗
// 找到寶藏後，在棋盤正中央（不管寶藏實際在哪一格）快速播放幾格「閃光→小狗吐舌頭+寶藏」
// 的慶祝畫面，語音唸完再呼叫 onDone 顯示結算畫面。gid：這一局的編號，重新開始後舊的慶祝會自己停掉
function playTreasureCelebration(speechText, gid, onDone){
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const boxSize = Math.min(canvas.width, canvas.height) / 3; // 佔棋盤 9 宮格正中間那一格
  const introFrames = [
    { sparkle:0.9, spread:0.30, chars:false, scale:0 },
    { sparkle:0.7, spread:0.38, chars:true,  scale:0.7 }
  ];
  // 語音還沒講完之前，畫面會一直停在這兩格輕微閃爍的「定格」狀態循環
  const loopFrames = [
    { sparkle:0.9,  spread:0.46, chars:true, scale:1 },
    { sparkle:0.55, spread:0.40, chars:true, scale:1 }
  ];
  let step = 0;
  let finished = false;

  function frameAt(n){
    return n < introFrames.length ? introFrames[n] : loopFrames[(n - introFrames.length) % loopFrames.length];
  }
  function renderFrame(){
    if(finished) return;
    if(gid !== state.gameId){ finished = true; clearInterval(timer); return; }
    draw(); // 棋盤本身維持顯示在背景
    const f = frameAt(step);
    if(f.chars){
      drawTreasure(cx + boxSize*0.16, cy + boxSize*0.06, boxSize*0.30 * f.scale);
      drawHappyDog(cx - boxSize*0.14, cy + boxSize*0.02, boxSize*0.62 * f.scale);
    }
    drawSparkleBurst(cx, cy, boxSize * f.spread, f.sparkle);
    step++;
  }

  renderFrame();
  const timer = setInterval(renderFrame, 375);

  function finish(){
    if(finished) return;
    finished = true;
    clearInterval(timer);
    if(gid === state.gameId) onDone();
  }
  speakSeq([speechText], finish);
  setTimeout(finish, 12000);   // 保險：語音沒有正常結束時，最多等 12 秒
}

// 棋盤尺寸只依「視窗大小」計算，完全不受右側資訊欄（結果／錯誤訊息等）高度變化影響。
// 手機版（<=700px）改成直式堆疊＋整頁可捲動，棋盤大小主要依螢幕「寬度」決定，再用高度夾一次。
function computeBoardSize(){
  const isMobileLayout = window.matchMedia('(max-width: 700px)').matches;
  const wrapChrome = 26;   // #boardWrap 的 padding(10*2) + border(3*2) 近似值

  if(isMobileLayout){
    const availableWidth = window.innerWidth - 28 - wrapChrome;
    let size = Math.min(availableWidth, 420 - wrapChrome);
    size = Math.max(180, size);
    // 量測棋盤上下其他區塊的高度，確保棋盤＋方向鍵＋控制鍵能同時塞進畫面
    const ids = ['playerGreeting','statRow','voiceWarnGame','stageLabel','instructionBox','errorMsg','ctlRow','dpad'];
    let chromeHeight = 0;
    ids.forEach(id => {
      const el = document.getElementById(id);
      if(el && window.getComputedStyle(el).display !== 'none') chromeHeight += el.getBoundingClientRect().height;
    });
    document.querySelectorAll('#boardWrap > h1, #boardWrap > .seal').forEach(el => {
      if(window.getComputedStyle(el).display !== 'none') chromeHeight += el.getBoundingClientRect().height;
    });
    const availableHeight = window.innerHeight - chromeHeight - wrapChrome - 48;
    size = Math.min(size, Math.max(160, availableHeight));
    return Math.floor(size);
  }

  const panel = document.getElementById('panel');
  const gameArea = document.getElementById('gameArea');
  const boardWrap = document.getElementById('boardWrap');
  const gap = 14;
  const panelWidth = (panel && panel.getBoundingClientRect().width) || 280;
  const areaRect = gameArea ? gameArea.getBoundingClientRect() : null;
  const areaHeight = areaRect ? areaRect.height : (window.innerHeight - 28);
  let headerHeight = 0;
  if(boardWrap){
    const h1El = boardWrap.querySelector('h1');
    const sealEl = boardWrap.querySelector('.seal');
    if(h1El) headerHeight += h1El.getBoundingClientRect().height;
    if(sealEl) headerHeight += sealEl.getBoundingClientRect().height;
    if(h1El || sealEl) headerHeight += 14;
  }
  const availableWidth = window.innerWidth - panelWidth - gap - 28 - wrapChrome;
  const availableHeight = areaHeight - wrapChrome - headerHeight;
  let size = Math.min(availableWidth, availableHeight);
  size = Math.max(240, Math.min(size, 640));
  return Math.floor(size);
}

function syncBoardHeight(){
  const size = computeBoardSize();
  canvas.width = size;
  canvas.height = size;
  CELL = size / GRID;
  draw();
}

// ===== 分數 =====
// 分數以「正確率」為主分，「每步平均思考時間」只作小幅扣分；思考時間不含語音播放與暫停，
// 所以選慢速語音、多按幾次 🔊 都不會被扣分。避免玩家用亂按方向鍵的方式衝快。
function computeScore(){
  const sec = Math.floor(state.activeMs / 1000);
  const totalPresses = state.totalPresses || 0;
  const errors = state.errorCount || 0;
  const accuracy = totalPresses > 0 ? totalPresses / (totalPresses + errors) : 0;
  const thinkSec = state.thinkMs / 1000;
  const avgThink = totalPresses > 0 ? thinkSec / totalPresses : thinkSec;
  let score = Math.round(accuracy * 1000 - avgThink * 50);
  score = Math.max(0, Math.min(1000, score));
  return { sec, thinkSec, totalPresses, errors, accuracy, avgThink, score, replays: state.replays || 0 };
}
// 評語：依正確率分五級（一次都沒錯 → 完美）
function commentKey(r){
  if(r.errors === 0) return 'k4';
  return r.accuracy >= 0.9 ? 'k3' : r.accuracy >= 0.75 ? 'k2' : r.accuracy >= 0.5 ? 'k1' : 'k0';
}

    <table class="resTable">
      ${row('accuracy', Math.round(r.accuracy * 100) + '%')}
      ${row('think', r.avgThink.toFixed(1) + ' s')}
      ${row('time', fmtMMSS(r.sec))}
      ${row('errors', r.errors)}
      ${row('replays', r.replays)}
    </table>
    <div class="comment" id="commentLine">${L(commentKey(r))}</div>
    ${practice ? `<p id="practiceHint">${L('practiceHint')}</p>` : '<div id="lbArea"></div>'}
    <button type="button" id="againBtn">${L('again')}</button>
    ${n < LEVEL_ORDER.length ? `<button type="button" id="nextLevelBtn">${L('next')}</button>` : ''}
    <button type="button" id="resMenuBtn" class="secBtn">${L('menu')}</button>`;
  $('againBtn').addEventListener('click', startGame);
  if($('nextLevelBtn')) $('nextLevelBtn').addEventListener('click', goToNextLevel);
  $('resMenuBtn').addEventListener('click', reopenNameGate);
  $('resultModal').style.display = 'flex';
  $('resultModal').scrollTop = 0;
  if(!practice) lbAfterGame(state.difficulty, r, state.gameId);
}

// ===== 排行榜（Firebase，下面的 module 提供 window.LB） =====
// 每台裝置（匿名登入）每一關只留一筆最高分；只顯示前 10 名
async function waitLB(){
  for(let i = 0; i < 50 && !window.LB; i++) await new Promise(r => setTimeout(r, 100));
  return window.LB || null;
}
function lbTable(list, myUid){
  if(!list.length) return `<p class="lbStatus">${L('lbEmpty')}</p>`;
  const medals = ['🥇','🥈','🥉'];
  return '<div class="lbList">' + list.map((e, i) => `<div class="lbRow${e.uid === myUid ? ' lbRowMe' : ''}">
      <div class="lbRowTop"><span class="lbRank">${medals[i] || (i + 1)}</span><span class="lbName">${esc(e.name || '???')}</span><span class="lbScore">${Number(e.score) || 0}</span></div>
      <div class="lbRowMeta">🎯 ${Number(e.acc) || 0}% · ❌ ${Number(e.errors) || 0} · ⏱ ${fmtMMSS(e.secs)}</div>
    </div>`).join('') + '</div>';
}
async function lbAfterGame(level, r, gid){
  const area = $('lbArea');
  if(!area) return;
  area.innerHTML = `<p class="lbStatus">${L('loading')}</p>`;
  const lb = await waitLB();
  const stillHere = () => gid === state.gameId && $('lbArea') === area;
  if(!lb){ if(stillHere()) area.innerHTML = `<p class="lbStatus">${L('lbError')}</p>`; return; }
  try{
    const res = await lb.submitBest(level, {
      name: state.playerName, score: r.score, think: Math.round(r.thinkSec * 10) / 10, secs: r.sec,
      errors: r.errors, presses: r.totalPresses, acc: Math.round(r.accuracy * 100), replays: r.replays
    });
    const top = await lb.top(level);
    if(!stillHere()) return;
    area.innerHTML = `<p class="lbStatus"><b>${L(res.saved ? 'lbNew' : 'lbNotBetter')}</b></p>` + lbTable(top.list, top.uid);
  }catch(e){
    console.error(e);
    if(stillHere()) area.innerHTML = `<p class="lbStatus">${L('lbError')}</p>`;
  }
}
let lbModalLevel = 'level2';
async function renderLbModal(){
  const tabs = $('lbTabs'), body = $('lbBody');
  tabs.innerHTML = ['level2','level3','level4'].map(lv =>
    `<button type="button" class="opt ${lv === lbModalLevel ? 'on' : ''}" data-lv="${lv}">${L('level' + levelNum(lv))}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { lbModalLevel = b.dataset.lv; renderLbModal(); }));
  body.innerHTML = `<p class="lbStatus">${L('loading')}</p>`;
  const want = lbModalLevel;
  const lb = await waitLB();
  if(want !== lbModalLevel) return;
  if(!lb){ body.innerHTML = `<p class="lbStatus">${L('lbError')}</p>`; return; }
  try{
    const top = await lb.top(want);
    if(want !== lbModalLevel) return;
    body.innerHTML = `<p class="lbNote">${L('lbNote')}</p>` + lbTable(top.list, top.uid);
  }catch(e){ console.error(e); body.innerHTML = `<p class="lbStatus">${L('lbError')}</p>`; }
}
$('gateLbBtn').addEventListener('click', () => {
  lbModalLevel = state.selectedLevel && state.selectedLevel !== 'level1' ? state.selectedLevel : 'level2';
  $('leaderboardModal').style.display = 'flex';
  renderLbModal();
  trackEvent('leaderboard_view', { level: lbModalLevel });
});
$('lbBackBtn').addEventListener('click', () => { $('leaderboardModal').style.display = 'none'; });

(function init(){
  const input = $('playerNameInput');

  try{ saved = localStorage.getItem(NAME_STORAGE_KEY) || ''; }catch(e){}

  $('nameGateBtn').addEventListener('click', submitPlayerName);
  updateCtlButtons();
  rerenderAll();
  draw();
  syncBoardHeight();
})();
</script>
<script type="module">
// 排行榜：Firebase 專案 perrito-busca-el-tesoro（匿名登入）
// 資料放在 perrito_boards/{level2|level3|level4}/entries/{匿名登入的 uid}，一台裝置一關一筆，只留最高分。
// 安全規則見 firestore.rules.txt（請貼到 Firebase 後台）。
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,query,orderBy,limit,getDocs,getDoc,doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAa58xLAL4dLphvdPEvWYAUfHrjM1kcnoo",
  authDomain: "perrito-busca-el-tesoro.firebaseapp.com",
  databaseURL: "https://perrito-busca-el-tesoro-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "perrito-busca-el-tesoro",
  storageBucket: "perrito-busca-el-tesoro.firebasestorage.app",
  messagingSenderId: "352935350375",
  appId: "1:352935350375:web:c50678d1e8bce967ae44c2",
  measurementId: "G-Z13037TCSW"
};
try{
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  async function ensureUid(){
    await auth.authStateReady();
    if(auth.currentUser) return auth.currentUser.uid;
    const c = await signInAnonymously(auth);
    return c.user.uid;
  }
  const BOARDS = ['level2','level3','level4'];
  // 排名用的數字：分數高的在前；同分時「思考時間」短的在前
  const rankOf = e => e.score * 100000 + (99999 - Math.min(99999, Math.round(e.think * 10)));
  window.LB = {
    async top(level){
      const uid = await ensureUid();
      const snap = await getDocs(query(collection(db, 'perrito_boards', level, 'entries'), orderBy('rank', 'desc'), limit(10)));
      return { uid, list: snap.docs.map(d => ({ uid: d.id, ...d.data() })) };
    },
    async submitBest(level, e){
      if(!BOARDS.includes(level)) return { saved:false };
      const uid = await ensureUid();
      const ref = doc(db, 'perrito_boards', level, 'entries', uid);
      const rank = rankOf(e);
      const old = await getDoc(ref);
      if(old.exists() && (Number(old.data().rank) || 0) >= rank) return { saved:false };
      await setDoc(ref, {
        name: [...String(e.name || '???')].slice(0, 12).join(''),
        score: e.score, think: e.think, secs: e.secs, errors: e.errors, presses: e.presses,
        acc: e.acc, replays: e.replays, rank, updatedAt: serverTimestamp()
      });
      return { saved:true };
    }
  };
}catch(e){ console.error('Firebase 初始化失敗', e); }
</script>
